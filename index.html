// Hazard effects: timing, frame anchor, and the damage box per frame (null = harmless frame).
const HAZ={
  'arcane_slime.fx':{fps:12,ax:32,ay:24,box:(i,h)=>{ const w=[0,24,40,56,64,0][i]; return w?{x:h.x-w/2,y:h.y-14,w,h:14}:null; }},
  'crystal_golem.fx':{fps:12,ax:0,ay:32,box:(i,h)=>{ const w=[8,16,28,40,52,58,0][i]; return w?{x:h.flip?h.x-w:h.x,y:h.y-18,w,h:18}:null; }},
  'shroom_mage.fx':{durs:[0.25,0.25,0.25,0.07,0.07,0.08,0.1,0.1],ax:16,ay:80,box:(i,h)=>i>=3&&i<=5?{x:h.x-8,y:h.y-72,w:16,h:72}:null},
  'hex_lantern.fx':{fps:12,ax:0,ay:16,box:(i,h)=>{ const w=[8,20,34,48,56,56,40,0][i]; return w?{x:h.flip?h.x-w:h.x,y:h.y-8,w,h:16}:null; }},
  'grimoire.fx':{durs:[0.12,0.12,0.08,0.15,0.15,0.15,0.1,0.1],ax:0,ay:8,box:(i,h)=>i>=3&&i<=5?{x:h.flip?h.x-80:h.x,y:h.y-4,w:80,h:8}:null},
  'star_moth.fx':{durs:[0.18,0.18,0.18,0.18,0.2,0.1,0.12,0.12],ax:32,ay:24,box:(i,h)=>i===5||i===6?{x:h.x-24,y:h.y-18,w:48,h:36}:null},
  'fx.root_snare':{durs:[0.3,0.3,0.08,0.1,0.25,0.15,0.15],ax:24,ay:60,box:(i,h)=>i>=3&&i<=5?{x:h.x-16,y:h.y-46,w:32,h:46}:null},
  'fx.aoe_telegraph':{fps:8,loop:true,ax:64,ay:32},
  'fx.bramble_ring':{fps:10,ax:64,ay:44,box:(i,h)=>i===3||i===4?{x:h.x-52,y:h.y-40,w:104,h:44}:null},
  'fx.haunt_fog':{fps:8,loop:true,ax:32,ay:36,box:(i,h)=>({x:h.x-16,y:h.y-22,w:32,h:26})},
  'fx.wisp_impact':{fps:16,ax:16,ay:16},
  'fx.thorn_impact':{fps:16,ax:16,ay:16}};
const PRJ={'fx.wisp_bolt':{fps:12,impact:'fx.wisp_impact'},'fx.thorn_spear':{fps:10,impact:'fx.thorn_impact'}};
function hazFrame(h){ const H=HAZ[h.anim];
  if(H.durs) return frameFromDurs(H.durs,h.t);
  const i=Math.floor(h.t*H.fps), n=nFrames(h.anim); return H.loop?i%n:(i<n?i:-1); }
function spawnHazard(o){ hazards.push(Object.assign({t:0,flip:false,hit:new Set()},o)); }
function prjHead(p){ const d=Math.hypot(p.vx,p.vy)||1; return p.anim==='fx.thorn_spear'?{x:p.x+p.vx/d*20,y:p.y}:{x:p.x+p.vx/d*9,y:p.y+p.vy/d*9}; }
function prjBox(p){ if(p.anim==='fx.thorn_spear') return {x:p.x-20,y:p.y-3,w:40,h:6}; const h=prjHead(p); return {x:h.x-5,y:h.y-5,w:10,h:10}; }
function prjImpact(p){ const h=prjHead(p); spawnHazard({anim:PRJ[p.anim].impact,x:h.x,y:h.y}); }
function floorBelow(x,y){ const tx=Math.floor(x/TS), t0=Math.floor(y/TS);
  for(let ty=t0;ty<Math.min(LH,t0+14);ty++){ const t=tile(tx,ty); if(solidT(t)||t===2) return ty*TS; } return y; }

class Mob{
  constructor(kind,x,y){ const M=MOB[kind];
    Object.assign(this,{id:++entId,type:kind,M,x,y,w:M.w,h:M.h,hp:M.hp,vx:0,vy:0,face:Math.random()<0.5?-1:1,state:'idle',st:0,
      t:Math.random()*10,hurtT:0,kbT:0,cool:rnd(1,2.5),dead:false,dying:false,acted:false,onGround:false,hitIds:new Set(),col:M.col,home:{x,y},tgt:null}); }
  get cx(){ return this.x+this.w/2; } get cy(){ return this.y+this.h/2; }
  set(s){ this.state=s; this.st=0; this.acted=false; }
  hurt(d,dir){
    if(this.dying) return; this.hp-=d; this.hurtT=0.18; this.knock(dir||0); burst(this.cx,this.cy,this.col,5,60);
    if(this.hp<=0){ this.dying=true; this.set('death'); kills++; sfx('kill'); burst(this.cx,this.cy,this.col,14,100);
      if(Math.random()<0.15) pickups.push(new Heart(this.cx-4,this.cy-4,true)); }
    else sfx('hit');
  }
  knock(dir){ if(this.type==='crystal_golem'){ this.vx=dir*40; this.kbT=0.1; return; }
    this.vx=dir*(this.M.fly?160:130); if(!this.M.fly) this.vy=-80; this.kbT=0.22; }
  walk(target){   // gravity + tile collision for walkers; returns true if it bumped a wall
    if(this.kbT>0){ this.kbT-=DT; this.vx=approach(this.vx,0,400*DT); } else this.vx=target;
    this.vy=Math.min(this.vy+GRAV*DT,380);
    const wall=moveX(this,this.vx*DT), r=moveY(this,this.vy*DT,false); if(r) this.vy=0;
    this.onGround=r==='floor'||probeFloor(this);
    if(this.y>LH*TS) this.dead=true;
    return wall;
  }
  edgeAhead(){ const fx=Math.floor((this.face>0?this.x+this.w+1:this.x-1)/TS), ty=Math.floor((this.y+this.h+1)/TS);
    const below=tile(fx,ty), ahead=tile(fx,ty-1); return !(below===1||below===2)||ahead===3; }
  fly(tx,ty,sp){
    if(this.kbT>0){ this.kbT-=DT; this.vx=approach(this.vx,0,300*DT); this.vy=approach(this.vy,0,300*DT); }
    else { const dx=tx-this.cx, dy=ty-this.cy, d=Math.hypot(dx,dy)||1, s=Math.min(sp,d*3);
      this.vx=approach(this.vx,dx/d*s,200*DT); this.vy=approach(this.vy,dy/d*s,200*DT); }
    this.x+=this.vx*DT; this.y+=this.vy*DT;
  }
  hover(){ this.vx=approach(this.vx,0,300*DT); this.vy=approach(this.vy,0,300*DT); this.x+=this.vx*DT; this.y+=this.vy*DT; }
  goHome(){ this.fly(this.home.x+this.w/2,this.home.y+this.h/2+Math.sin(this.t)*6,22); if(this.state!=='idle') this.set('idle'); }
  update(){
    this.t+=DT; this.st+=DT; if(this.hurtT>0) this.hurtT-=DT; this.cool-=DT;
    if(this.state==='death'){ if(!this.M.fly) this.walk(0); if(this.st>=nFrames(this.type+'.death')/this.M.fps.death) this.dead=true; return; }
    const p=nearest(this.cx,this.cy), dx=p?p.cx-this.cx:0, dy=p?p.cy-this.cy:0, adx=Math.abs(dx), M=this.M;
    switch(this.type){
      case 'arcane_slime': {   // hops along; leaps at a ghost and slams goo waves out both ways
        if(this.state==='attack'){
          if(this.st<0.2){ this.walk(0); break; }
          if(!this.acted){ this.acted=true; this.vy=-230; this.kbT=0; sfx('jump'); }
          this.walk(this.face*90);
          if(this.st>0.3&&this.onGround){ spawnHazard({anim:'arcane_slime.fx',x:this.cx,y:this.y+this.h}); sfx('land'); shake(2); this.set('move'); this.cool=2.2; }
          break; }
        if(p&&this.cool<=0&&adx<100&&Math.abs(dy)<40&&this.onGround){ this.face=dx<0?-1:1; this.set('attack'); break; }
        if(this.state!=='move') this.set('move');
        const wall=this.walk(this.face*M.speed);
        if(this.kbT<=0&&(wall||(this.onGround&&this.edgeAhead()))) this.face*=-1;
        break; }
      case 'crystal_golem': {  // lumbers toward ghosts; slams a crystal shockwave along the ground
        if(this.state==='attack'){ this.walk(0);
          if(!this.acted&&this.st>=0.5){ this.acted=true; spawnHazard({anim:'crystal_golem.fx',x:this.face>0?this.x+this.w-2:this.x+2,y:this.y+this.h,flip:this.face<0}); shake(4); sfx('slam'); }
          if(this.st>=0.75){ this.set('idle'); this.cool=2; } break; }
        if(p&&this.cool<=0&&adx<48&&Math.abs(dy)<40){ this.face=dx<0?-1:1; this.set('attack'); break; }
        const chase=p&&adx<150&&Math.abs(dy)<48;
        if(chase) this.face=dx<0?-1:1;
        const go=chase?(this.edgeAhead()?0:this.face*M.speed*1.4):this.face*M.speed;
        if(go&&this.state!=='move') this.set('move'); if(!go&&this.state!=='idle') this.set('idle');
        const wall=this.walk(go);
        if(!chase&&this.kbT<=0&&(wall||(this.onGround&&this.edgeAhead()))) this.face*=-1;
        break; }
      case 'shroom_mage': {    // pads around; calls an arcane sky strike down on a ghost
        if(this.state==='attack'){ this.walk(0);
          if(!this.acted&&this.st>=0.5){ this.acted=true; const t=this.tgt;
            if(t&&!t.dead){ spawnHazard({anim:'shroom_mage.fx',x:t.cx,y:floorBelow(t.cx,t.y+t.h)}); sfx('shoot'); } }
          if(this.st>=0.625){ this.set('move'); this.cool=3.2; } break; }
        if(p&&this.cool<=0&&adx<190&&Math.abs(dy)<130){ this.tgt=p; this.face=dx<0?-1:1; this.set('attack'); break; }
        const away=this.x-this.home.x; if(Math.abs(away)>24) this.face=away>0?-1:1;
        if(this.state!=='move') this.set('move');
        const wall=this.walk(this.face*M.speed); if(wall||(this.onGround&&this.edgeAhead())) this.face*=-1;
        break; }
      case 'hex_lantern': {    // drifts up close and breathes a cone of hexflame
        if(this.state==='attack'){ this.hover();
          if(!this.acted&&this.st>=0.2){ this.acted=true; spawnHazard({anim:'hex_lantern.fx',x:this.cx+this.face*6,y:this.cy+2,flip:this.face<0}); sfx('dash'); }
          if(this.st>=0.6){ this.set('idle'); this.cool=2.6; } break; }
        if(!p||Math.hypot(dx,dy)>170){ this.goHome(); break; }
        this.face=dx<0?-1:1; this.fly(p.cx-this.face*44,p.cy-4+Math.sin(this.t*2)*6,M.speed);
        if(this.state!=='move') this.set('move');
        if(this.cool<=0&&adx<64&&Math.abs(dy)<20) this.set('attack');
        break; }
      case 'grimoire': {       // keeps its distance, charges, and fires a rune beam
        if(this.state==='attack'){ this.hover();
          if(!this.acted&&this.st>=0.83){ this.acted=true; spawnHazard({anim:'grimoire.fx',x:this.cx+this.face*8,y:this.cy,flip:this.face<0}); sfx('shoot'); }
          if(this.st>=0.95){ this.set('idle'); this.cool=3; } break; }
        if(!p||Math.hypot(dx,dy)>220){ this.goHome(); break; }
        this.face=dx<0?-1:1; this.fly(p.cx+(this.cx<p.cx?-1:1)*100,p.cy+Math.sin(this.t*1.5)*4,M.speed);
        if(this.state!=='move') this.set('move');
        if(this.cool<=0&&Math.abs(dy)<14&&adx>50&&adx<150) this.set('attack');
        break; }
      case 'star_moth': {      // flutters around a ghost and draws a constellation trap that detonates
        if(this.state==='attack'){ this.hover();
          if(!this.acted&&this.st>=0.6){ this.acted=true; const t=this.tgt; if(t&&!t.dead){ spawnHazard({anim:'star_moth.fx',x:t.cx,y:t.cy}); sfx('shoot'); } }
          if(this.st>=0.75){ this.set('idle'); this.cool=3.6; } break; }
        if(!p||Math.hypot(dx,dy)>180){ this.goHome(); break; }
        this.face=dx<0?-1:1; const a=this.t*1.3+this.id;
        this.fly(p.cx+Math.cos(a)*56,p.cy-30+Math.sin(a*2)*14,M.speed);
        if(this.state!=='move') this.set('move');
        if(this.cool<=0&&Math.hypot(dx,dy)<120){ this.tgt=p; this.set('attack'); }
        break; }
    }
  }
  pose(){
    if(this.hurtT>0&&this.state!=='death') return [this.type+'.hurt',this.hurtT>0.12?0:1];
    const n=this.type+'.'+this.state, nf=nFrames(n), fps=this.M.fps[this.state]||8;
    const once=this.state==='attack'||this.state==='death';
    return [n,once?Math.min(nf-1,Math.floor(this.st*fps)):Math.floor(this.t*fps)%nf];
  }
  draw(){ const [n,i]=this.pose(), M=this.M, flip=this.face!==M.face;
    if(M.fly) drawAnim(n,i,this.cx,this.cy+Math.sin(this.t*3)*1.5,M.ax,M.ay,flip);
    else drawAnim(n,i,this.cx,this.y+this.h,M.ax,M.ay,flip); }
}
class Heart{
  constructor(x,y,drop){ Object.assign(this,{x,y,w:9,h:8,vy:drop?-120:0,t:Math.random()*5,dead:false,phys:!!drop}); }
  update(){
    this.t+=DT;
    if(this.phys){ this.vy=Math.min(this.vy+GRAV*DT,300); if(moveY(this,this.vy*DT,false)==='floor'){ this.vy=0; this.phys=false; } }
    for(const p of players) if(!p.dead&&p.hp<p.maxHp&&overlap(p,this)){
      p.hp=Math.min(p.maxHp,p.hp+2); this.dead=true; sfx('heal'); popup(p.cx,p.y-6,'+2',p.i?PAL[1].heart:'#ffffff'); burst(this.x+4,this.y+4,'#ff6b8a',10,60); break; }
    if(this.y>LH*TS) this.dead=true;
  }
  draw(){ g.drawImage(HEART_PICK,Math.round(this.x),Math.round(this.y+(this.phys?0:Math.sin(this.t*4)*1.5-1))); }
}
class Lantern{
  constructor(x,y,active){ Object.assign(this,{x,y,w:10,h:26,active:!!active,t:Math.random()*5}); }
  update(){
    this.t+=DT; if(this.active) return;
    if(players.some(p=>!p.dead&&overlap(p,this))){
      this.active=true; respawn={x:this.x,y:this.y+this.h-PH};
      for(const p of players){ if(p.dead) p.reviveNow(p.maxHp); else p.hp=p.maxHp; }
      sfx('check'); popup(this.x+5,this.y-8,'LANTERN LIT','#8ff7e8'); burst(this.x+5,this.y+4,'#8ff7e8',20,80);
    }
  }
  draw(){
    const x=Math.round(this.x), y=Math.round(this.y);
    if(this.active) g.drawImage(GLOW_L,x+5-28,y+4-28);
    g.fillStyle='#3a3350'; g.fillRect(x+4,y+8,2,18); g.fillRect(x+2,y+25,6,1);
    g.fillStyle='#4a4262'; g.fillRect(x+3,y-2,4,2);
    g.fillStyle='#2a2540'; g.fillRect(x+1,y,8,9);
    g.fillStyle=this.active?(Math.sin(this.t*13)>0?'#c9fff4':'#8ff7e8'):'#141122'; g.fillRect(x+2,y+1,6,7);
    if(this.active){ g.fillStyle='#ffffff'; g.fillRect(x+4,y+3,2,3); }
    g.fillStyle='#2a2540'; g.fillRect(x+4,y+1,2,7);
  }
}

// ---------------------------------------------------------------- boss: the Forest Wraith
// Attacks: wisp bolts, a volley of thorn spears, root snares under each ghost, and a bramble ring
// (telegraphed) that leaves it stunned and taking extra damage. From half health it also calls haunt fog.
class Boss{
  constructor(){ Object.assign(this,{w:30,h:44,x:(AR.x0+AR.x1)/2-15,y:AR.top-70,hp:70,maxHp:70,state:'wait',st:0,age:0,t:0,face:-1,hurtT:0,
    hitIds:new Set(),phase:1,last:'',act:'',acted:false,sx:0,sy:0,bx:0,spearN:0,spearT:0,spearDir:1}); }
  get cx(){ return this.x+this.w/2; } get cy(){ return this.y+this.h/2; }
  vulnerable(){ return !['wait','intro','dying','gone'].includes(this.state); }
  set(s,t){ this.state=s; this.st=t; this.age=0; this.acted=false; }
  hurt(d){
    if(!this.vulnerable()) return;
    if(this.state==='stun') d=Math.ceil(d*1.5);
    this.hp-=d; this.hurtT=0.12; sfx('hit');
    if(this.hp<=0){ this.hp=0; this.set('dying',1.2); sfx('bossdie'); projectiles=[]; hazards=[]; }
    else if(this.phase===1&&this.hp<=this.maxHp/2){ this.phase=2; this.act='roar'; this.set('cast',0.75); sfx('roar'); shake(7); }
  }
  update(){
    this.t+=DT; this.st-=DT; this.age+=DT; if(this.hurtT>0) this.hurtT-=DT;
    const sp=this.phase===2?1.3:1, tgt=nearest(this.cx,this.cy), hoverY=AR.floor-this.h-44;
    const ease=(v,to,k)=>v+(to-v)*Math.min(1,k*DT);
    switch(this.state){
      case 'wait': return;
      case 'intro': this.y=ease(this.y,hoverY,2); if(this.st<=0) this.set('idle',1); break;
      case 'idle':
        if(tgt){ this.face=tgt.cx<this.cx?-1:1; this.x=approach(this.x,clamp(tgt.cx-this.w/2,AR.x0+90,AR.x1-90-this.w),40*sp*DT); }
        this.y=ease(this.y,hoverY+Math.sin(this.t*2)*6,3);
        if(this.st<=0) this.pick(); break;
      case 'move': this.x=ease(this.x,this.sx,3); this.y=ease(this.y,this.sy,3); if(this.st<=0) this.set('cast',0.75); break;
      case 'cast':   // attack animation; the attack itself lands on frame 3
        if(!this.acted&&this.age>=0.375){ this.acted=true; this.doAct(sp); }
        if(this.st<=0) this.afterCast(); break;
      case 'spears': this.spearT-=DT;
        if(this.spearT<=0&&this.spearN>0){ this.throwSpear(sp); this.spearN--; this.spearT=0.32/sp; }
        if(this.spearN===0&&this.spearT<=0) this.set('idle',this.phase===2?0.7:1.1); break;
      case 'brambleWait':
        if(this.st<=0){ spawnHazard({anim:'fx.bramble_ring',x:this.bx,y:AR.floor}); shake(6); sfx('slam'); this.set('stun',2.4); } break;
      case 'stun': this.y=ease(this.y,AR.floor-this.h-4,4); if(this.st<=0) this.set('idle',0.6); break;
      case 'dying':
        if(this.st<=0){ this.state='gone'; bossDefeated=true; victoryT=1.8; burst(this.cx,this.cy,'#ffffff',50,170); burst(this.cx,this.cy,'#9fe8c8',40,140); flashT=0.3; sfx('win'); } break;
    }
    this.x=clamp(this.x,AR.x0+16,AR.x1-this.w-16);
  }
  pick(){
    let opts=['wisp','spears','snare','bramble']; if(this.phase===2) opts.push('fog');
    opts=opts.filter(o=>o!==this.last); const a=opts[Math.floor(Math.random()*opts.length)]; this.last=a; this.act=a;
    const al=alivePlayers(), mid=al.length?al.reduce((s,p)=>s+p.cx,0)/al.length:this.cx, c=(AR.x0+AR.x1)/2;
    if(a==='spears'){ this.spearDir=mid<c?-1:1; this.sx=mid<c?AR.x1-this.w-30:AR.x0+30; this.sy=AR.floor-this.h-60; this.face=this.spearDir; this.set('move',0.9); }
    else if(a==='bramble'){ const t=nearest(this.cx,this.cy); this.bx=clamp(t?t.cx:c,AR.x0+5*TS+56,AR.x1-5*TS-56);
      this.sx=this.bx-this.w/2; this.sy=AR.floor-this.h-24; this.set('move',0.8); }
    else this.set('cast',0.75);
  }
  doAct(sp){
    if(this.act==='wisp'){
      const t=nearest(this.cx,this.cy); if(!t) return;
      const n=this.phase===2?5:3, ox=this.cx, oy=this.cy+2, base=Math.atan2(t.cy-oy,t.cx-ox);
      for(let i=0;i<n;i++){ const a=base+(i-(n-1)/2)*0.26; projectiles.push({anim:'fx.wisp_bolt',x:ox,y:oy,vx:Math.cos(a)*115*sp,vy:Math.sin(a)*115*sp,t:0,life:5}); }
      sfx('shoot');
    } else if(this.act==='snare'){
      for(const p of alivePlayers()) spawnHazard({anim:'fx.root_snare',x:p.cx,y:floorBelow(p.cx,p.y+p.h)});
      if(this.phase===2){ const x=rnd(AR.x0+6*TS,AR.x1-6*TS); spawnHazard({anim:'fx.root_snare',x,y:AR.floor}); }
      sfx('gate');
    } else if(this.act==='bramble'){
      spawnHazard({anim:'fx.aoe_telegraph',x:this.bx,y:AR.floor,life:0.95}); sfx('fizzle');
    } else if(this.act==='fog'){
      for(const s of [-1,1]) spawnHazard({anim:'fx.haunt_fog',x:this.cx+s*50,y:this.cy+10,life:6,seek:true,rearm:1});
      sfx('roar');
    } else if(this.act==='roar') shake(8);
  }
  afterCast(){
    if(this.act==='spears'){ this.spearN=3; this.spearT=0; this.state='spears'; }
    else if(this.act==='bramble') this.set('brambleWait',0.6);
    else this.set('idle',this.phase===2?0.8:1.2);
  }
  throwSpear(sp){
    const lanes=[AR.floor-10,LEDGE_Y-12,79*TS-12], y=lanes[Math.floor(Math.random()*lanes.length)];
    projectiles.push({anim:'fx.thorn_spear',x:this.cx,y,vx:this.spearDir*230*sp,vy:0,t:0,life:4}); sfx('dash');
  }
  pose(){
    if(this.state==='dying') return ['wraith.death',Math.min(5,Math.floor((1.2-this.st)*5))];
    if(this.hurtT>0) return ['wraith.hurt',this.hurtT>0.08?0:1];
    if(this.state==='stun'){ const el=2.4-this.st; if(el<0.1) return ['wraith.stun',0]; if(this.st<0.25) return ['wraith.stun',this.st<0.12?11:10]; return ['wraith.stun',2+Math.floor(el*10)%8]; }
    if(this.state==='cast') return ['wraith.attack',Math.min(5,Math.floor(this.age*8))];
    return ['wraith.idle',Math.floor(this.t*8)%6];
  }
  draw(){ if(this.state==='wait'||this.state==='gone') return; const [n,i]=this.pose(); drawAnim(n,i,this.cx,this.y+this.h+2,32,58,this.face>0); }
}

// ---------------------------------------------------------------- level build
// The Whispering Wood: one connected world of caverns, shafts and canopy halls.
//   Moonlit Edge (start) -> Rootwell shaft -> Glowcap Hollow (hub, lantern, sealed door)
//   hub west -> Fern Thicket (climb, Spirit Mask)
//   hub east -> Thornwood -> climb -> Thornwood Canopy (Moon Sigil, hidden Spirit Mask)
//   hub down -> Rootdeep -> The Tangled Deep (Moon Sigil)
//   both sigils open the seal -> descent -> Elder Grove (boss)
function buildLevel(){
  grid=[]; for(let y=0;y<LH;y++) grid.push(new Array(LW).fill(1));
  const carve=(x0,y0,x1,y1)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) setT(x,y,0); };
  const fill=(x0,y0,x1,y1,v=1)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) setT(x,y,v); };
  const plat=(x0,x1,y)=>{ for(let x=x0;x<=x1;x++) setT(x,y,2); };
  const thorns=(x0,x1,y)=>{ for(let x=x0;x<=x1;x++) setT(x,y,3); };

  // Moonlit Edge (surface, open sky)
  carve(1,0,58,24);
  fill(13,24,21,24); fill(15,23,19,23);          // mossy hill
  plat(24,27,21); plat(29,31,18);                // fallen-log ledges
  thorns(33,35,24);
  fill(38,23,43,24);                             // raised bank
  carve(61,19,68,24); fill(59,21,60,24,5);       // hidden mask room behind cracked bark
  // Rootwell: drop shaft with a ladder of ledges back up
  carve(46,25,53,51);
  [28,34,40,46].forEach(y=>plat(51,53,y)); [31,37,43,49].forEach(y=>plat(46,48,y));
  plat(48,51,23);                                // hanging log over the mouth, so the surface stays crossable
  // Glowcap Hollow (hub)
  carve(18,52,82,68);
  plat(51,53,52); [55,61,67].forEach(y=>plat(46,48,y)); [58,64].forEach(y=>plat(51,53,y));
  fill(58,66,64,68); fill(57,67,57,68); fill(65,67,65,68);
  plat(76,79,66); plat(79,82,63);
  carve(26,69,29,72); plat(26,27,71);            // drop to Rootdeep
  carve(83,56,92,59);                            // tunnel east to Thornwood
  carve(83,64,96,68); fill(SEAL.x,SEAL.y0,SEAL.x,SEAL.y1,6);
  // Fern Thicket
  carve(8,63,17,68); carve(2,46,16,68);
  plat(12,15,66); plat(7,10,63); plat(2,5,60); plat(7,10,57); plat(12,15,54); plat(6,10,51);
  thorns(3,6,68);
  // Thornwood, its climb, and the canopy above
  carve(93,50,118,59); thorns(100,102,59);
  carve(116,36,122,59);
  [57,51,45].forEach(y=>plat(116,118,y)); [54,48].forEach(y=>plat(120,122,y));
  carve(95,34,140,41); plat(116,122,42);
  thorns(127,129,41);
  carve(133,30,140,33);
  carve(86,37,93,41); fill(94,38,94,41,5);       // hidden mask room
  // Rootdeep and the Tangled Deep
  carve(10,73,60,82);
  plat(22,25,80); plat(28,31,77); plat(24,27,74);   // top ledge sits under the hole
  thorns(50,52,82);
  carve(56,83,60,89);
  carve(20,90,82,97);
  plat(58,60,95); plat(55,57,92); plat(58,60,89); plat(56,57,86);
  thorns(34,36,97); thorns(64,66,97);
  fill(20,95,26,97);
  // Descent to the Elder Grove
  carve(93,69,96,79); carve(86,80,99,82);
  plat(95,96,81); plat(93,94,78); plat(95,96,75); plat(93,94,72);
  // Elder Grove: one screen whose collision matches the painted backdrop (assets/boss_room.png)
  carve(100,72,129,85); fill(100,83,104,85); fill(125,83,129,85);
  plat(107,109,82); plat(113,116,79); plat(120,122,82);

  entId=0; enemies=[];
  const walker=(k,c,r)=>enemies.push(new Mob(k,c*TS+1,groundY(c,r,MOB[k].h)));
  const flyer=(k,c,r)=>enemies.push(new Mob(k,c*TS,r*TS));
  [[26,20],[41,20],[30,60],[68,60],[11,60],[106,55],[100,38],[134,38],[18,78],[45,78],[30,93],[46,93],[72,93]]
    .forEach(([c,r])=>walker('arcane_slime',c,r));
  [[36,40],[112,55],[104,38],[66,93]].forEach(([c,r])=>walker('crystal_golem',c,r));
  [[36,14],[50,38],[35,57],[70,57],[8,55],[12,50],[112,53],[119,48],[110,37],[126,36],[44,76],[52,93],[36,93]]
    .forEach(([c,r],i)=>flyer(i%2?'star_moth':'hex_lantern',c,r));
  [[61,60],[108,38],[33,78],[62,93]].forEach(([c,r])=>walker('shroom_mage',c,r));
  [[110,53],[131,36],[40,90]].forEach(([c,r])=>flyer('grimoire',c,r));
  pickups=[[30,15],[74,60],[108,55],[48,93]].map(([c,r])=>new Heart(c*TS+4,groundY(c,r,8)-2));
  lanterns=[[2,20],[40,60],[96,55],[40,78],[89,83]].map(([c,r],i)=>new Lantern(c*TS+3,groundY(c,r,26),i===0));
  items=[['mask',65,22],['mask',8,48],['mask',89,39],['sigil',137,38],['sigil',23,92]]
    .map(([k,c,r])=>new Item(k,c*TS+2,groundY(c,r,12)-3));
  walls=[[[59,21],[59,22],[59,23],[59,24],[60,21],[60,22],[60,23],[60,24]],[[94,38],[94,39],[94,40],[94,41]]]
    .map((tiles,id)=>({id,tiles,hp:3,broken:false,hitIds:new Set()}));
  secrets=[{x0:61,y0:19,x1:68,y1:24,wall:0,revealed:false},{x0:86,y0:37,x1:93,y1:41,wall:1,revealed:false}];
  cover=new Uint8Array(LW*LH);
  for(const sc of secrets) for(let y=sc.y0;y<=sc.y1;y++) for(let x=sc.x0;x<=sc.x1;x++) cover[y*LW+x]=1;

  worldTexts=[
    {x:3*TS,y:13*TS,s:'P1 WHITE: A/D MOVE, W JUMP, F SWORD, G DASH',c:'#ecf7f0'},
    {x:3*TS,y:13*TS+9,s:'P2 BLACK: ARROWS MOVE, . SWORD, / DASH',c:'#c4adff'},
    {x:12*TS,y:18*TS,s:'HOLD JUMP WHILE FALLING TO GLIDE',c:'#9fe7d6'},
    {x:26*TS,y:15*TS,s:'DOWN + SWORD IN THE AIR TO POGO OFF THORNS',c:'#9fe7d6'},
    {x:36*TS,y:19*TS+6,s:'DROP DOWN THE ROOTWELL TOGETHER',c:'#e2d6ff'},
    {x:48*TS,y:16*TS+8,s:'SOME WALLS ARE NOT WHAT THEY SEEM',c:'#9fe7d6'},
    {x:28*TS,y:61*TS,s:'STAY CLOSE TO FORM A SOUL LINK. FULL BOND: E / RSHIFT',c:'#e2d6ff'},
    {x:33*TS,y:63*TS,s:'HOLD TAB TO VIEW THE MAP',c:'#8ff7e8'},
    {x:66*TS,y:61*TS,s:'TWO MOON SIGILS BREAK THE SEAL',c:'#ffe08a'},
    {x:86*TS+4,y:80*TS+4,s:'THE ELDER GROVE LIES BEYOND',c:'#ff9db0'}];

  // foliage: grass, ferns and glowcaps on floors; vines from ceilings
  decorByCol=Array.from({length:LW},()=>[]);
  const SHC=['c','m','a'];
  for(let x=1;x<LW-1;x++) for(let y=1;y<LH-1;y++){
    if(grid[y][x]!==0||inGrove(x,y)) continue;
    if(grid[y+1][x]===1){ const h=hash(x*7,y*13), px=x*TS, py=(y+1)*TS;
      if(h<0.11) decorByCol[x].push({t:'s',x:px+3+Math.floor(hash(x,y)*9),y:py,c:SHC[Math.floor(hash(y,x)*3)],n:1+Math.floor(hash(x*3,y*5)*3)});
      else if(h<0.5) decorByCol[x].push({t:'g',x:px,y:py,s:Math.floor(hash(x*11,y*3)*1000)});
      else if(h<0.58) decorByCol[x].push({t:'f',x:px+4,y:py}); }
    if(grid[y-1][x]===1&&hash(x*5,y*3)<0.24)
      decorByCol[x].push({t:'v',x:x*TS+1+Math.floor(hash(x,y*2)*14),y:y*TS,len:6+Math.floor(hash(x*2,y)*30),b:hash(y,x*3)<0.35});
  }
}

class Item{
  constructor(kind,x,y){ Object.assign(this,{kind,x,y,w:12,h:12,t:Math.random()*5,taken:false}); }
  update(){ this.t+=DT; if(this.taken) return; if(players.some(p=>!p.dead&&overlap(p,this))){ this.taken=true; collectItem(this); } }
  draw(){ if(this.taken||cover[Math.floor((this.y+6)/TS)*LW+Math.floor((this.x+6)/TS)]) return; const x=Math.round(this.x), y=Math.round(this.y+Math.sin(this.t*2.5)*2);
    g.drawImage(this.kind==='mask'?GLOW_MASK:GLOW_GOLD,x+6-22,y+6-22);
    g.drawImage(this.kind==='mask'?MASK.r:SIGIL.r,x+(this.kind==='mask'?1:0),y); }
}
function collectItem(it){
  const cx=it.x+6, cy=it.y+6;
  if(it.kind==='mask'){ for(const p of players){ p.maxHp++; if(!p.dead) p.hp=p.maxHp; }
    sfx('check'); burst(cx,cy,'#ffffff',26,110); showBanner('SPIRIT MASK FOUND. MAX HEALTH UP FOR BOTH GHOSTS'); }
  else { sigils++; sfx('win'); burst(cx,cy,'#ffe08a',30,120); flashT=0.12;
    showBanner(sigils>=2?'BOTH MOON SIGILS FOUND. THE SEAL IN THE HOLLOW BREAKS':'MOON SIGIL FOUND ('+sigils+'/2)');
    if(sigils>=2) openSeal(); }
}
function openSeal(){ for(let y=SEAL.y0;y<=SEAL.y1;y++) setT(SEAL.x,y,0); shake(6); sfx('gate'); mapDirty=true; }
function showBanner(s){ rec('n',[s]); banner={s,t:4}; }
function revealSecret(id){ for(const sc of secrets) if(sc.wall===id&&!sc.revealed){ sc.revealed=true;
  for(let y=sc.y0;y<=sc.y1;y++) for(let x=sc.x0;x<=sc.x1;x++) cover[y*LW+x]=0; } mapDirty=true; }
function hitWall(w){ w.hp--; shake(2); sfx('hit'); const [tx,ty]=w.tiles[w.tiles.length-1]; burst(tx*TS+8,ty*TS+8,'#3a4a40',8,70);
  if(w.hp<=0) breakWall(w); }
function breakWall(w){ w.broken=true; for(const [tx,ty] of w.tiles){ setT(tx,ty,0); burst(tx*TS+8,ty*TS+8,'#2a3633',6,90); }
  revealSecret(w.id); sfx('gate'); showBanner('A HIDDEN PATH OPENS'); }

function resetGame(){
  buildLevel();
  players=[new Player(0,4*TS,25*TS-PH), new Player(1,6*TS,25*TS-PH)];
  projectiles=[]; hazards=[]; particles=[]; popups=[]; nova=null;
  boss=new Boss(); bossActive=false; bossDefeated=false; bond=30; linked=false; sigils=0;
  respawn={x:4*TS,y:25*TS-PH}; gameOverT=0; victoryT=0; kills=0; playTime=0; bossTitleT=0; paused=false;
  explored=new Uint8Array(EXW*EXH); visitedZones=new Set(); areaTitle={s:'',t:0}; banner={s:'',t:0}; mapDirty=true;
  cam.zone=null; cam.anchor=0; updateCam(true);
}
function startGame(){ initAudio(); resetGame(); state='play'; sfx('check'); }
function respawnAll(){
  players.forEach((p,i)=>{ Object.assign(p,{dead:false,hp:p.maxHp,x:respawn.x+(i?8:-8),y:respawn.y,vx:0,vy:0,inv:1.5,trail:[],revive:0,dashT:0,atkT:0,offT:0});
    p.lastSafe={x:p.x,y:p.y}; });
  projectiles=[]; hazards=[]; nova=null;
  if(bossActive&&!bossDefeated){ bossActive=false; boss=new Boss(); for(let y=GATE.y0;y<=GATE.y1;y++) setT(GATE.x,y,0); }
  updateCam(true);
}
function closeGate(){
  for(let y=GATE.y0;y<=GATE.y1;y++) setT(GATE.x,y,4);
  for(const p of players) if(p.x<AR.x0+4){ p.x=AR.x0+8; p.y=LEDGE_Y-p.h; }
  bossActive=true; boss.set('intro',2.2); bossTitleT=3; areaTitle.t=0; visitedZones.add('ELDER GROVE'); shake(6); sfx('gate'); mapDirty=true;
}
const NOVA_T=0.5, NOVA_R=[6,12,22,34,46,56,62];   // spirit_nova: 7 frames at 14fps, ring radius per frame
const inGrove=(x,y)=>x>=100&&x<=129&&y>=72&&y<=88;
function triggerNova(){
  const [a,b]=players, x=(a.cx+b.cx)/2, y=(a.cy+b.cy)/2;
  nova={x,y,t:0,hit:new Set()}; bond=0; flashT=0.18; shake(9); sfx('nova');
  for(const p of players){ p.inv=Math.max(p.inv,1.2); if(p.hp<p.maxHp){ p.hp++; popup(p.cx,p.y-8,'+1',p.i?PAL[1].heart:'#ffffff'); } }
  burst(x,y,'#ffffff',20,160); burst(x,y,'#7dffb0',30,150);
  popup(x,y-24,'SPIRIT NOVA!','#ffffff');
}

// ---------------------------------------------------------------- update
function step(){
  gtime+=DT; net.frame++;
  if(pressed.KeyM) muted=!muted;
  if(state==='title') titleStep();
  else if(state==='lobby') lobbyStep();
  else if(net.lost){ if(pressed.Enter||pressed.NumpadEnter||pressed.Escape) backToTitle(); updateParticles(); }
  else if(net.mode==='guest') guestStep();
  else {
    inputs=net.mode==='host'?[mergeInputs(readInput(0),readInput(1)),NEUTRAL_IN]:[readInput(0),readInput(1)];
    gameStep();
    if(net.mode==='host'&&net.frame%2===0) send(snapshot());
  }
}
function gameStep(){
  const startPressed=pressed.Enter||pressed.NumpadEnter||inputs.some(i=>i.startP);
  if(state==='victory'){ updateParticles(); if(startPressed) startGame(); return; }
  if(pressed.KeyP||pressed.Escape||inputs.some(i=>i.startP)) paused=!paused;
  if(paused){ if(net.mode==='host') syncRemoteCounts(); if(pressed.KeyQ) backToTitle(); return; }
  if(hitstop>0){ hitstop-=DT; return; }
  playTime+=DT;
  if(net.mode==='host') inputs[1]=remoteInput();

  players.forEach((p,i)=>p.update(inputs[i]));

  // soul link + special
  const [a,b]=players;
  const wasLinked=linked;
  linked=!a.dead&&!b.dead&&Math.hypot(a.cx-b.cx,a.cy-b.cy)<LINK_R;
  if(linked&&!wasLinked&&bond<100) burst((a.cx+b.cx)/2,(a.cy+b.cy)/2,'#e2d6ff',6,40);
  bond=Math.min(100,bond+(linked?4:1)*DT);
  players.forEach((p,i)=>{ if(!p.dead&&inputs[i].specialP){
    if(linked&&bond>=100) triggerNova();
    else { sfx('fizzle'); popup(p.cx,p.y-8,bond<100?'BOND NOT FULL':'TOO FAR APART','#ff9db0'); } } });

  const camMx=cam.x+VW/2, camMy=cam.y+VH/2;
  for(const e of enemies) if(!e.dead&&(e.summoned||(Math.abs(e.cx-camMx)<VW*0.85&&Math.abs(e.cy-camMy)<VH*0.95))) e.update();
  if(bossActive) boss.update();

  // projectiles (wisp bolts, thorn spears)
  for(const p of projectiles){
    p.x+=p.vx*DT; p.y+=p.vy*DT; p.t+=DT; p.life-=DT;
    const h=prjHead(p);
    if(p.life<=0||solidT(tile(Math.floor(h.x/TS),Math.floor(h.y/TS)))){ p.dead=true; prjImpact(p); continue; }
    const b=prjBox(p);
    for(const pl of players) if(!pl.dead&&overlap(pl,b)&&pl.inv<=0&&pl.dashT<=0){ pl.hurt(1,p.x); p.dead=true; prjImpact(p); break; }
  }
  projectiles=projectiles.filter(p=>!p.dead);
  // hazards: mob and boss attack effects
  for(const h of hazards){
    h.t+=DT;
    if(h.seek){ const t=nearest(h.x,h.y); if(t){ const dx=t.cx-h.x, dy=t.cy-h.y, d=Math.hypot(dx,dy)||1; h.x+=dx/d*26*DT; h.y+=dy/d*26*DT; } }
    if(h.rearm&&(h.rt=(h.rt||0)+DT)>h.rearm){ h.rt=0; h.hit.clear(); }
    const i=hazFrame(h);
    if(i<0||(h.life!==undefined&&h.t>h.life)){ h.dead=true; continue; }
    const box=HAZ[h.anim].box, b=box&&box(i,h);
    if(b) for(const pl of players) if(!pl.dead&&!h.hit.has(pl)&&overlap(pl,b)){ h.hit.add(pl); if(pl.inv<=0&&pl.dashT<=0) pl.hurt(1,b.x+b.w/2); }
  }
  hazards=hazards.filter(h=>!h.dead);

  // spirit nova
  if(nova){
    nova.t+=DT; const r=NOVA_R[Math.min(6,Math.floor(nova.t*14))];
    const inR=(x,y,pad=0)=>Math.hypot(x-nova.x,y-nova.y)<r+pad;
    for(const e of enemies) if(!e.dead&&!e.dying&&!nova.hit.has(e)&&inR(e.cx,e.cy,10)){ nova.hit.add(e); e.hurt(6,e.cx<nova.x?-1:1); }
    if(bossActive&&boss.vulnerable()&&!nova.hit.has(boss)&&inR(boss.cx,boss.cy,22)){ nova.hit.add(boss); boss.hurt(10); }
    for(const p of projectiles) if(inR(p.x,p.y)){ p.dead=true; prjImpact(p); }
    for(const h of hazards) if(HAZ[h.anim].box&&inR(h.x,h.y)) h.dead=true;
    if(nova.t>=NOVA_T) nova=null;
  }

  // contact damage
  for(const p of players){ if(p.dead) continue;
    for(const e of enemies){ if(e.dead||e.dying||!overlap(p,e)) continue;
      if(p.inv<=0&&p.dashT<=0){ p.hurt(1,e.cx); if(e.M.fly){ e.vx=(e.cx<p.cx?-1:1)*120; e.vy=-80; e.kbT=0.3; } } }
    if(bossActive&&boss.vulnerable()&&boss.state!=='stun'&&overlap(p,{x:boss.x+4,y:boss.y+6,w:boss.w-8,h:boss.h-10})) p.hurt(1,boss.cx);
  }
  enemies=enemies.filter(e=>!e.dead);

  for(const h of pickups) h.update(); pickups=pickups.filter(h=>!h.dead);
  for(const l of lanterns) l.update();
  for(const it of items) it.update();

  if(!bossActive&&!bossDefeated){ const al=alivePlayers(); if(al.length&&al.every(p=>p.x>AR.x0+3*TS&&p.y>AR.top)) closeGate(); }
  if(bossTitleT>0) bossTitleT-=DT;

  updateCam();
  warpStragglers();
  afterCam();
  ambientFx();
  updateParticles();
  if(flashT>0) flashT-=DT;
  shakeMag*=0.88; if(shakeMag<0.2) shakeMag=0;

  if(players.every(p=>p.dead)){ if(gameOverT<=0) gameOverT=2.6; }
  if(gameOverT>0){ gameOverT-=DT; if(gameOverT<=0) respawnAll(); }
  if(victoryT>0){ victoryT-=DT; if(victoryT<=0) state='victory'; }
}
const clampZ=(v,a,b)=>a>b?(a+b)/2:clamp(v,a,b);
function updateCam(instant){
  const al=alivePlayers(); let tx=cam.x, ty=cam.y, lox=-1e9, hix=1e9, loy=-1e9, hiy=1e9;
  // The anchor is who the camera keeps when the ghosts can't both fit: whoever is standing.
  let A=players[cam.anchor]; const B=players[1-cam.anchor];
  if(A.dead||(!A.ground&&!B.dead&&B.ground)){ cam.anchor=1-cam.anchor; A=B; }
  if(bossActive){ tx=AR.x0; ty=AR.top; }
  else if(al.length){
    const mnx=Math.min(...al.map(p=>p.x)), mxx=Math.max(...al.map(p=>p.x+p.w));
    const mny=Math.min(...al.map(p=>p.y)), mxy=Math.max(...al.map(p=>p.y+p.h));
    const mx=(mnx+mxx)/2, my=(mny+mxy)/2;
    tx=mx-VW/2; ty=my-VH/2-10;
    const z=zoneAt(mx,my); if(z) cam.zone=z;
    if(cam.zone){ const Z=cam.zone; tx=clampZ(tx,Z.x0*TS,Z.x1*TS-VW); ty=clampZ(ty,Z.y0*TS,Z.y1*TS-VH); }
    lox=mxx+12-VW; hix=mnx-12; loy=mxy+16-VH; hiy=mny-30;
    if(lox>hix){ tx=A.cx-VW/2; lox=-1e9; hix=1e9; } else tx=clamp(tx,lox,hix);
    if(loy>hiy){ ty=A.cy-VH/2; loy=-1e9; hiy=1e9; } else ty=clamp(ty,loy,hiy);
  }
  if(instant){ cam.x=tx; cam.y=ty; }
  else { cam.x+=(tx-cam.x)*Math.min(1,7*DT); cam.y+=(ty-cam.y)*Math.min(1,6*DT); }
  cam.x=clamp(clamp(cam.x,lox,hix),0,LW*TS-VW);
  cam.y=clamp(clamp(cam.y,loy,hiy),0,LH*TS-VH);
}
// A ghost left off-screen (its partner went on without it) is pulled back after a moment.
function warpStragglers(){
  if(bossActive) return;
  for(const p of players){
    if(p.dead){ p.offT=0; continue; }
    const q=p.partner(), inView=p.x+p.w>cam.x-6&&p.x<cam.x+VW+6&&p.y+p.h>cam.y-6&&p.y<cam.y+VH+6;
    p.offT=inView?0:p.offT+DT;
    if(p.offT>1.1&&!q.dead){ p.offT=0; p.x=q.lastSafe.x; p.y=q.lastSafe.y-2; p.vx=p.vy=0; p.inv=Math.max(p.inv,1);
      burst(p.cx,p.cy,PAL[p.i].sword,16,80); popup(p.cx,p.y-8,'PULLED TO PARTNER','#bff4ff'); sfx('dash'); }
  }
}
// Map exploration and area title cards, from whatever the camera shows (host, local and guest).
function afterCam(){
  const c0=Math.max(0,Math.floor(cam.x/TS/EXC)), c1=Math.min(EXW-1,Math.floor((cam.x+VW)/TS/EXC));
  const r0=Math.max(0,Math.floor(cam.y/TS/EXC)), r1=Math.min(EXH-1,Math.floor((cam.y+VH)/TS/EXC));
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(!explored[r*EXW+c]){ explored[r*EXW+c]=1; mapDirty=true; }
  const z=zoneAt(cam.x+VW/2,cam.y+VH/2);
  if(z&&z.n&&!visitedZones.has(z.n)&&!bossActive){ visitedZones.add(z.n); areaTitle={s:z.n,t:3.5}; }
  if(areaTitle.t>0) areaTitle.t-=DT;
  if(banner.t>0) banner.t-=DT;
}
function updateParticles(){
  for(const p of particles){ p.vy+=(p.grav||0)*DT; p.x+=p.vx*DT; p.y+=p.vy*DT; p.vx*=0.96; p.vy*=0.96; p.life-=DT; }
  particles=particles.filter(p=>p.life>0);
  if(particles.length>900) particles.splice(0,particles.length-900);
  for(const p of popups){ p.y-=18*DT; p.life-=DT*0.8; }
  popups=popups.filter(p=>p.life>0);
}

// ---------------------------------------------------------------- render
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixC=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
const SKY_S=['#0b1a28','#0d2130','#0f2836','#12303c','#163843','#1a4049','#1e4850'].map(hexRGB);
const SKY_D=['#04070d','#060b13','#080f19','#0a131f','#0c1825','#0e1d2b','#102231'].map(hexRGB);
const TRUNK_FAR=[hexRGB('#0f2a33'),hexRGB('#0a1a24')], TRUNK_NEAR=[hexRGB('#0a1e24'),hexRGB('#07131a')];
// Mystic forest backdrop: moonlit sky near the surface fading to deep blue-black below,
// giant trunks in two parallax layers, canopy light shafts, glowing shelf fungus, vines and mist.
function drawBackground(cx,cy){
  const d=clamp(cy/(LH*TS-VH),0,1), bh=Math.ceil(VH/7);
  for(let i=0;i<7;i++){ g.fillStyle=mixC(SKY_S[i],SKY_D[i],Math.min(1,d*1.6)); g.fillRect(0,i*bh,VW,bh+1); }
  const sky=1-clamp(d*4,0,1);
  if(sky>0){
    g.globalAlpha=sky;
    for(const s of stars){ const sx=mod(s.x-cx*0.05,960); if(sx>=VW) continue;
      g.fillStyle=(Math.sin(gtime*2+s.b*20)>0.6)?'#ffffff':(s.b>0.5?'#8fb8b0':'#4f7a78'); g.fillRect(sx|0,(s.y-cy*0.05)|0,1,1); }
    const mx=Math.round(390-cx*0.03), my=Math.round(48-cy*0.08), r=20;
    g.globalAlpha=0.08*sky; g.fillStyle='#d8fff4'; for(const rr of [46,35,27]){ g.beginPath(); g.arc(mx,my,rr,0,7); g.fill(); }
    g.globalAlpha=sky;
    for(let dy=-r;dy<=r;dy++){ const w=Math.round(Math.sqrt(r*r-dy*dy)); g.fillStyle=dy<-12?'#f6fffb':'#e2f5ee'; g.fillRect(mx-w,my+dy,w*2,1); }
    g.fillStyle='#c4ddd6'; g.fillRect(mx-8,my-6,5,4); g.fillRect(mx+4,my+3,6,5); g.fillRect(mx-3,my+9,3,3);
    g.globalAlpha=1;
  }
  drawTrunks(cx*0.18,cy*0.12,150,34,70,mixC(TRUNK_FAR[0],TRUNK_FAR[1],d),'#16404a',0);
  const ls=0.06*(1-d);
  if(ls>0.005){ g.globalAlpha=ls; g.fillStyle='#c8fff0';
    for(let k=-1;k<4;k++){ const x=mod(k*190-cx*0.3,VW+240)-120; g.beginPath(); g.moveTo(x,0); g.lineTo(x+26,0); g.lineTo(x+110,VH); g.lineTo(x+60,VH); g.fill(); }
    g.globalAlpha=1; }
  drawTrunks(cx*0.42,cy*0.32,120,14,30,mixC(TRUNK_NEAR[0],TRUNK_NEAR[1],d),'#123038',1);
  g.globalAlpha=0.06; g.fillStyle='#8ff0d8';
  for(let i=0;i<3;i++){ const fx=mod(gtime*(5+i*3)-cx*(0.5+i*0.15),760)-240, fy=mod(150+i*60-cy*0.4,VH+40)-20; g.fillRect(Math.round(fx),Math.round(fy),300,10); }
  g.globalAlpha=1;
}
function drawTrunks(ox,oy,sp,wmin,wmax,col,rim,layer){
  for(let k=Math.floor(ox/sp)-1;k<=Math.floor((ox+VW)/sp)+1;k++){
    const w=Math.round(wmin+(wmax-wmin)*hash(k,layer*17+3)), x=Math.round(k*sp+hash(k,layer*5+1)*sp*0.5-ox);
    g.fillStyle=col; g.fillRect(x,0,w,VH);
    g.fillStyle=rim; g.fillRect(x+w-2,0,2,VH);
    for(let j=0;j<3;j++){ const bx=x+2+Math.floor(hash(k*3+j,layer)*(w-6)), by=Math.round(mod(hash(k,j+9)*400-oy,400)-60);
      g.fillRect(bx,by,1,40+Math.floor(hash(j,k)*60)); }
    if(layer!==1) continue;
    for(let j=0;j<2;j++){ const fy=Math.round(mod(hash(k,j*7+2)*360-oy,360)-40), fx=j%2?x-6:x+w;
      g.drawImage(GLOW_FUN,fx+3-14,fy-14); g.fillStyle='#5fe0c8'; g.fillRect(fx,fy,6,2); g.fillStyle='#bff8ec'; g.fillRect(fx+1,fy,4,1); }
    g.fillStyle='#14382e';
    for(let j=0;j<2;j++){ const vx=x+Math.floor(hash(k,j+31)*w), vy=Math.round(mod(hash(k,j+40)*300-oy,300)-80), len=30+Math.floor(hash(j,k+5)*60);
      for(let s=0;s<len;s+=2){ const sw=Math.round(Math.sin(gtime*1.2+s*0.08+k)*(s/len)*2); g.fillRect(vx+sw,vy+s,1,2); } }
  }
}
function drawTiles(cx,cy){
  const c0=Math.max(0,Math.floor(cx/TS)), c1=Math.min(LW-1,Math.floor((cx+VW)/TS));
  const r0=Math.max(0,Math.floor(cy/TS)), r1=Math.min(LH-1,Math.floor((cy+VH)/TS));
  const grove=c1>=100&&c0<=129&&r1>=72&&r0<=88;
  if(grove) drawGrove();
  // hidden rooms count as solid so their outline doesn't give them away
  const vs=(x,y)=>y<0||solidT(tile(x,y))||(x>=0&&x<LW&&y>=0&&y<LH&&cover[y*LW+x]===1);
  for(let y=r0;y<=r1;y++) for(let x=c0;x<=c1;x++){
    const t=grid[y][x]; if(!t||(grove&&inGrove(x,y))) continue; const X=x*TS, Y=y*TS, v=Math.floor(hash(x,y)*4);
    if(t===1||t===5){
      g.drawImage(vs(x,y-1)?T.solid[v]:T.top[v],X,Y);
      g.fillStyle='#0a1112';
      if(!vs(x-1,y)) g.fillRect(X,Y,1,TS);
      if(!vs(x+1,y)) g.fillRect(X+TS-1,Y,1,TS);
      if(!vs(x,y+1)) g.fillRect(X,Y+TS-1,TS,1);
      if(t===5){ const w=walls.find(w=>w.tiles.some(([a,b])=>a===x&&b===y)); g.globalAlpha=Math.min(1,0.35+(w?(3-w.hp)*0.22:0)); g.drawImage(T.crack,X,Y); g.globalAlpha=1; }
    }
    else if(t===2) g.drawImage(T.plat,X,Y);
    else if(t===3) g.drawImage(T.spike,X,Y);
    else if(t===4) g.drawImage(T.gate,X,Y);
    else if(t===6) g.drawImage(T.door,X,Y);
  }
}
function drawDecor(cx,cy){
  const c0=Math.max(0,Math.floor(cx/TS)-1), c1=Math.min(LW-1,Math.floor((cx+VW)/TS)+1);
  for(let c=c0;c<=c1;c++) for(const d of decorByCol[c]){
    if(d.y<cy-40||d.y>cy+VH+40) continue;
    if(d.t==='g'){ for(let i=0;i<4;i++){ const h=2+((d.s>>i)&3), bx=d.x+2+i*3+((d.s>>(i+4))&1), sw=Math.round(Math.sin(gtime*2+bx*0.3)*0.6);
        g.fillStyle=i%2?'#3fae6e':'#5fd38a'; g.fillRect(bx,d.y-h,1,h); if(sw) g.fillRect(bx+sw,d.y-h-1,1,1); } }
    else if(d.t==='f'){ g.fillStyle='#2e8a58'; g.fillRect(d.x+3,d.y-6,1,6); g.fillRect(d.x,d.y-5,3,1); g.fillRect(d.x+4,d.y-4,3,1);
      g.fillRect(d.x+1,d.y-3,2,1); g.fillRect(d.x+4,d.y-2,3,1); g.fillStyle='#5fd38a'; g.fillRect(d.x+3,d.y-7,1,1); }
    else if(d.t==='s'){ const col=d.c==='c'?['#7ff5e0','#d8fff6']:d.c==='m'?['#e07ff5','#fbe0ff']:['#f5d07f','#fff2cf'];
      g.globalAlpha=0.6+0.4*Math.sin(gtime*2+d.x); g.drawImage(SHROOM_GLOW[d.c],d.x-9,d.y-14); g.globalAlpha=1;
      for(let i=0;i<d.n;i++){ const mx=d.x+i*4-(d.n-1)*2, h=3+((i*5+d.x)%3);
        g.fillStyle='#cfd8c8'; g.fillRect(mx+1,d.y-h,1,h); g.fillStyle=col[0]; g.fillRect(mx,d.y-h-2,3,2); g.fillStyle=col[1]; g.fillRect(mx,d.y-h-2,1,1); } }
    else if(d.t==='v'){
      for(let s=0;s<d.len;s+=2){ const sw=Math.round(Math.sin(gtime*1.5+d.x*0.2+s*0.1)*(s/d.len)*1.5);
        g.fillStyle=s%6===4?'#3fae6e':'#21593f'; g.fillRect(d.x+sw,d.y+s,1,2); if(s%6===4) g.fillRect(d.x+sw+1,d.y+s,1,1); }
      if(d.b){ const sw=Math.round(Math.sin(gtime*1.5+d.x*0.2+d.len*0.1)*1.5);

  }
}
function drawSecrets(){ for(const sc of secrets){ if(sc.revealed) continue;
  for(let y=sc.y0;y<=sc.y1;y++) for(let x=sc.x0;x<=sc.x1;x++) g.drawImage(T.solid[Math.floor(hash(x,y)*4)],x*TS,y*TS); } }

const isExplored=(px,py)=>explored[clamp(Math.floor(py/TS/EXC),0,EXH-1)*EXW+clamp(Math.floor(px/TS/EXC),0,EXW-1)]===1;
function renderMap(){
  const m=MAPC.getContext('2d'); m.clearRect(0,0,MAPC.width,MAPC.height);
  const open=(a,b)=>{ const t=tile(a,b); return (t===0||t===2||t===3)&&!cover[b*LW+a]; };
  for(let y=0;y<LH;y++) for(let x=0;x<LW;x++){
    if(!explored[Math.floor(y/EXC)*EXW+Math.floor(x/EXC)]) continue;
    const t=grid[y][x], hid=cover[y*LW+x]===1; let c=null;
    if(!hid&&(t===0||t===2||t===3)) c=t===3?'#8a3a6a':t===2?'#4f9a78':'#173a34';
    else if(t===6) c='#ffe08a';

function drawTether(){

  const nx=-(b.cy-a.cy)/d, ny=(b.cx-a.cx)/d, full=bond>=100;

    const s=full?2:1; g.fillRect(Math.round(a.cx+(b.cx-a.cx)*t+nx*w-s/2),Math.round(a.cy+(b.cy-a.cy)*t+ny*w-s/2),s,s); }

function drawNova(){ if(nova) drawAnim('fx.spirit_nova',Math.min(6,Math.floor(nova.t*14)),nova.x,nova.y,64,64,false); }
function drawHazard(h){ const H=HAZ[h.anim], i=hazFrame(h); if(i>=0) drawAnim(h.anim,i,h.x,h.y,H.ax,H.ay,h.flip); }

function drawWorld(){
  const sx=shakeMag?Math.round(rnd(-shakeMag,shakeMag)):0, sy=shakeMag?Math.round(rnd(-shakeMag,shakeMag)):0;
  const cx=Math.round(cam.x), cy=Math.round(cam.y);
  drawBackground(cx,cy);
  for(const m of motes){   // fireflies
    const x=mod(m.x-cx*m.p+Math.sin(gtime*0.7+m.ph)*10,VW), y=mod(m.y-cy*m.p-gtime*8*m.s,VH), a=0.35+0.35*Math.sin(gtime*2.5+m.ph*3);
    g.fillStyle=m.c; g.globalAlpha=a*0.3; g.fillRect((x|0)-1,(y|0)-1,3,3); g.globalAlpha=a; g.fillRect(x|0,y|0,1,1); }

  for(const l of lanterns) if(vis(l.x,l.y)) l.draw();

function overlay(a){ g.fillStyle=`rgba(5,4,13,${a})`; g.fillRect(0,0,VW,VH); }
function fmtTime(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

function render(){

}

// ---------------------------------------------------------------- loop
let last=performance.now(), acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000); last=now;
  while(acc>=DT){ step(); acc-=DT; for(const k in pressed) delete pressed[k]; }
  render();
  requestAnimationFrame(frame);
}
function boot(){
resetGame();
if(location.hash==='#worldmap'){
  const big=document.createElement('canvas'); big.width=LW*TS; big.height=LH*TS; const bg=big.getContext('2d');
  for(let y=0;y<LH*TS;y+=VH) for(let x=0;x<LW*TS;x+=VW){ cam.x=x; cam.y=y; drawWorld(); bg.drawImage(cvs,x,y); }
  for(const sc of secrets){ bg.strokeStyle='#ff0'; bg.strokeRect(sc.x0*TS,sc.y0*TS,(sc.x1-sc.x0+1)*TS,(sc.y1-sc.y0+1)*TS); }
  big.style.width='100vw'; big.style.height='auto'; document.body.replaceChildren(big); document.body.style.overflow='auto';
} else {
  // #at-X-Y starts a local game with both ghosts at tile X,Y (-map holds the map open, -ffN fast-forwards N frames)
  const m=/^#at-(\d+)-(\d+)(-map)?(?:-ff(\d+))?$/.exec(location.hash);
  if(m){ startGame(); for(const p of players){ p.x=+m[1]*TS+p.i*14; p.y=+m[2]*TS-PH; p.lastSafe={x:p.x,y:p.y}; } updateCam(true); afterCam(); if(m[3]) keys.Tab=true;
    for(let f=0;f<(+m[4]||0);f++){ step(); for(const p of players){ p.hp=p.maxHp; } } }
  requestAnimationFrame(frame); cvs.focus();
}
}
if(!SPRITES){ g.fillStyle='#06050d'; g.fillRect(0,0,VW,VH); text('MISSING ASSETS/SPRITES.JS',VW/2,120,'#ff9db0',2,'center'); text('RUN: PYTHON3 TOOLS/BUILD_SPRITES.PY',VW/2,146,'#bdb4e0',1,'center'); }
else { let loaded=0; const done=()=>{ if(++loaded===2) boot(); }; ATLAS.onload=done; ROOM.onload=done; ATLAS.src=SPRITES.atlas; ROOM.src=SPRITES.room; }
