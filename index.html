<title>Twin Spirits</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  /* Single-look arcade screen: one pixel canvas centered on a night-violet void. */
  :root{
    --void:#06050d;
    --ink:#d9d4f2;
    color-scheme:dark;
  }
  html,body{margin:0;height:100%;background:var(--void);color:var(--ink);overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;}
  canvas:focus-visible{box-shadow:0 0 0 2px #a98bff;}
</style>

<canvas id="c" width="480" height="272" tabindex="0" aria-label="Twin Spirits, a two player ghost platformer"></canvas>

<script src="assets/sprites.js"></script>
<script>
'use strict';
// =====================================================================
//  TWIN SPIRITS — 2 player co-op pixel platformer
// =====================================================================
const VW=480, VH=272, TS=16, DT=1/60;
const GRAV=820, JUMP=310, MOVE=95, ATK_T=0.2, LINK_R=96;

const cvs=document.getElementById('c');
const g=cvs.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){
  const s=Math.min(innerWidth/VW, innerHeight/VH);
  const k=s>=2?Math.floor(s):s;
  cvs.style.width=Math.floor(VW*k)+'px';
  cvs.style.height=Math.floor(VH*k)+'px';
}
addEventListener('resize',fit); fit();

// ---------------------------------------------------------------- utils
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}

// ---------------------------------------------------------------- pixel font (3x5)
const FONT={
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
'9':'111101111001110','.':'000000000000010',',':'000000000010100','!':'010010010000010','?':'110001010000010',
'-':'000000111000000','/':'001001010100100',':':'000010000010000','+':'000010111010000','(':'010100100100010',
')':'010001001001010',"'":'010010000000000','>':'100010001010100','<':'001010100010001','=':'000111000111000',
'&':'010101010101011',' ':'000000000000000'};
const TC=new Map();
function textCanvas(s,col,sc){
  const k=s+'|'+col+'|'+sc; let c=TC.get(k); if(c) return c;
  c=document.createElement('canvas'); c.width=Math.max(1,s.length*4*sc); c.height=5*sc;
  const x=c.getContext('2d'); x.fillStyle=col;
  for(let i=0;i<s.length;i++){const f=FONT[s[i]]; if(!f) continue;
    for(let p=0;p<15;p++) if(f[p]==='1') x.fillRect(i*4*sc+(p%3)*sc,((p/3)|0)*sc,sc,sc);}
  TC.set(k,c); return c;
}
function text(s,x,y,col='#fff',sc=1,align='left',sh=true){
  s=String(s).toUpperCase();
  const w=s.length*4*sc-sc;
  if(align==='center') x-=Math.floor(w/2); else if(align==='right') x-=w;
  x=Math.round(x); y=Math.round(y);
  if(sh) g.drawImage(textCanvas(s,'#05040c',sc),x+sc,y+sc);
  g.drawImage(textCanvas(s,col,sc),x,y);
}

// ---------------------------------------------------------------- audio
let AC=null, NOISE=null, muted=false;
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=NOISE.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ AC=null; } }
  if(AC&&AC.state==='suspended') AC.resume();
}
function tone(f,dur,type='square',vol=0.05,slide=0,delay=0){
  if(!AC||muted) return; const t=AC.currentTime+delay;
  const o=AC.createOscillator(), gn=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol=0.05,freq=1500,delay=0){
  if(!AC||muted) return; const t=AC.currentTime+delay;
  const s=AC.createBufferSource(); s.buffer=NOISE;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const gn=AC.createGain(); gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(gn).connect(AC.destination); s.start(t); s.stop(t+dur+0.02);
}
function playSfx(n){
  if(!AC||muted) return;
  switch(n){
    case 'jump': tone(300,0.1,'square',0.035,250); break;
    case 'land': noise(0.05,0.03,700); break;
    case 'slash': noise(0.07,0.05,3500); tone(760,0.07,'triangle',0.03,-420); break;
    case 'dash': noise(0.14,0.05,1800); tone(220,0.12,'sine',0.05,420); break;
    case 'hit': tone(190,0.08,'square',0.05,-100); noise(0.05,0.05,2500); break;
    case 'kill': tone(520,0.16,'square',0.045,-440); noise(0.12,0.04,1200); break;
    case 'hurt': tone(170,0.22,'sawtooth',0.06,-120); break;
    case 'die': tone(420,0.7,'triangle',0.06,-380); break;
    case 'revive': [0,0.08,0.16,0.24].forEach((d,i)=>tone(392*Math.pow(1.26,i),0.18,'triangle',0.05,0,d)); break;
    case 'shoot': tone(620,0.14,'sine',0.035,-320); break;
    case 'parry': tone(1300,0.08,'square',0.035,-700); break;
    case 'nova': tone(110,0.9,'sawtooth',0.07,700); tone(220,0.9,'triangle',0.06,1100); noise(0.6,0.06,1400); break;
    case 'fizzle': tone(140,0.09,'square',0.03,-40); break;
    case 'heal': tone(600,0.1,'triangle',0.05,300); tone(900,0.14,'triangle',0.04,300,0.08); break;
    case 'check': [0,0.1,0.2].forEach((d,i)=>tone(523*Math.pow(1.335,i),0.25,'triangle',0.05,0,d)); break;
    case 'gate': noise(0.8,0.09,380); tone(70,0.8,'sawtooth',0.06,-25); break;
    case 'slam': noise(0.45,0.1,500); tone(65,0.45,'square',0.07,-30); break;
    case 'roar': tone(88,1.1,'sawtooth',0.07,-40); tone(93,1.1,'sawtooth',0.05,-45); noise(1,0.04,600); break;
    case 'bossdie': tone(200,2,'sawtooth',0.06,-170); noise(2,0.07,900); break;
    case 'win': [0,0.12,0.24,0.36,0.6].forEach((d,i)=>tone([523,659,784,1046,1318][i],0.35,'triangle',0.05,0,d)); break;
  }
}

// ---------------------------------------------------------------- sprite generation
function makeSprite(w,h,fn,out){
  const W=w+2,H=h+2,c=document.createElement('canvas'); c.width=W; c.height=H;
  const cx=c.getContext('2d'), m=new Uint8Array(W*H);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){const col=fn(x,y); if(col){m[(y+1)*W+x+1]=1; cx.fillStyle=col; cx.fillRect(x+1,y+1,1,1);}}
  if(out){ cx.fillStyle=out;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(m[y*W+x]) continue;
      if((x>0&&m[y*W+x-1])||(x<W-1&&m[y*W+x+1])||(y>0&&m[(y-1)*W+x])||(y<H-1&&m[(y+1)*W+x])) cx.fillRect(x,y,1,1);}}
  return c;
}
function flipC(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return n;}
function whiteC(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const x=n.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,n.width,n.height);return n;}
function spr(w,h,fn,out){const c=makeSprite(w,h,fn,out),wc=whiteC(c);return{r:c,l:flipC(c),wr:wc,wl:flipC(wc),w:c.width,h:c.height};}
function drawS(s,x,y,left,white){g.drawImage(white?(left?s.wl:s.wr):(left?s.l:s.r),Math.round(x),Math.round(y));}
function makeGlow(r,rgb,a=0.35){const c=document.createElement('canvas');c.width=c.height=r*2;const x=c.getContext('2d');
  const gr=x.createRadialGradient(r,r,0,r,r,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=gr;x.fillRect(0,0,r*2,r*2);return c;}

const PAL=[
  {name:'WHITE',key:'ghost_white',body:'#f2f0ff',out:'#7fb6ff',sword:'#bfe6ff',heart:'#ece9ff',heartHi:'#ffffff'},
  {name:'BLACK',key:'ghost_black',body:'#3a2c5a',out:'#ff5fb0',sword:'#ff8fd0',heart:'#a98bff',heartHi:'#e2d6ff'}];
const GLOW_L=makeGlow(28,'143,247,232',0.3);

// ---- sprite atlas: built by tools/build_sprites.py from the art in sprites/ into assets/sprites.js
const SPRITES=window.SPRITES;
const ATLAS=new Image(), ROOM=new Image();
const nFrames=n=>SPRITES.anims[n].f.length;
// Draw frame i of animation n so the frame point (ax,ay) lands on world point (x,y); flip mirrors around it.
function drawAnim(n,i,x,y,ax,ay,flip,alpha){
  const a=SPRITES.anims[n], r=a.f[clamp(i|0,0,a.f.length-1)];
  const dx=Math.round(x-(flip?a.w-ax:ax)), dy=Math.round(y-ay);
  if(alpha!==undefined) g.globalAlpha=alpha;
  if(flip){ g.save(); g.translate(dx+r[2],dy); g.scale(-1,1); g.drawImage(ATLAS,r[0],r[1],r[2],r[3],0,0,r[2],r[3]); g.restore(); }
  else g.drawImage(ATLAS,r[0],r[1],r[2],r[3],dx,dy,r[2],r[3]);
  if(alpha!==undefined) g.globalAlpha=1;
}
function drawAnimRot(n,i,x,y,ang){
  const a=SPRITES.anims[n], r=a.f[clamp(i|0,0,a.f.length-1)];
  g.save(); g.translate(Math.round(x),Math.round(y)); g.rotate(ang); g.drawImage(ATLAS,r[0],r[1],r[2],r[3],-(r[2]>>1),-(r[3]>>1),r[2],r[3]); g.restore();
}
function drawAnimScaled(n,i,x,y,sc,flip){
  const r=SPRITES.anims[n].f[i];
  if(flip){ g.save(); g.translate(x+r[2]*sc,y); g.scale(-1,1); g.drawImage(ATLAS,r[0],r[1],r[2],r[3],0,0,r[2]*sc,r[3]*sc); g.restore(); }
  else g.drawImage(ATLAS,r[0],r[1],r[2],r[3],x,y,r[2]*sc,r[3]*sc);
}
function frameFromDurs(durs,t){ let acc=0; for(let i=0;i<durs.length;i++){ acc+=durs[i]; if(t<acc) return i; } return -1; }

const MASK=spr(9,10,(x,y)=>{ const dx=x-4, dy=y-4.5; if(dx*dx/17+dy*dy/26>1) return null;
  if((x===2||x===6)&&(y===4||y===5)) return '#1b1830'; if(y>=8&&x===4) return '#c4c0e0';
  return (x<3&&y<4)?'#ffffff':'#e9e6ff'; },'#6d6890');
const SIGIL=spr(10,10,(x,y)=>{ const a=(x-4.5)**2+(y-4.5)**2, b=(x-6.6)**2+(y-3.2)**2;
  if(a>21||b<12) return null; return (x<4&&y<5)?'#fff6d0':'#ffd86a'; },'#8a6a20');
const GLOW_GOLD=makeGlow(22,'255,216,106',0.35), GLOW_MASK=makeGlow(22,'220,220,255',0.3), GLOW_FUN=makeGlow(14,'95,224,200',0.3);
const SHROOM_GLOW={c:makeGlow(10,'127,245,224',0.35),m:makeGlow(10,'224,127,245',0.35),a:makeGlow(10,'245,208,127',0.3)};
const HEART=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
const heartSpr=(c,hi)=>makeSprite(7,6,(x,y)=>HEART[y][x]==='X'?((x===1&&y===1)?hi:c):null,'#0b0916');
const HEARTS=PAL.map(p=>heartSpr(p.heart,p.heartHi));
const HEART_E=heartSpr('#2d2840','#3a3452');
const HEART_PICK=heartSpr('#ff6b8a','#ffd0dc');

// tiles: dark forest earth, living moss, branch ledges, bramble thorns
function makeTile(fn){const c=document.createElement('canvas');c.width=c.height=TS;const x=c.getContext('2d');
  for(let j=0;j<TS;j++)for(let i=0;i<TS;i++){const col=fn(i,j);if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}return c;}
const earth=v=>(x,y)=>{ const n=hash(x+v*16,y+v*31), m=hash((x>>2)+v*7,(y>>2)+v*13);
  if(hash(x*3+v*11,y*5+v)<0.012) return '#3f9c86';
  if(n<0.09) return '#121a1c'; if(n>0.94) return '#2a3633';
  if(m<0.18) return '#22261f';
  return m>0.6?'#1c2729':'#182224'; };
const T={
  solid:[0,1,2,3].map(v=>makeTile(earth(v))),
  top:[0,1,2,3].map(v=>makeTile((x,y)=>{
    const drip=hash(x*3+v,7)<0.25?6:hash(x*5+v,9)<0.45?5:3;
    if(y===0) return hash(x+v*9,1)<0.4?'#9df5b0':'#5fd38a';
    if(y===1) return '#3fae6e';
    if(y<drip) return y===drip-1?'#1f5a40':'#2e8a58';
    return earth(v)(x,y); })),
  plat:makeTile((x,y)=>{
    if(y===0) return hash(x,3)<0.35?'#6fd38a':'#a8865a';
    if(y<=3) return (x%7===2&&y===2)?'#3e2c1e':(y===1?'#8a6a46':'#6b4f35');
    if(y===4) return '#3a2a1c';
    if(x%5===1&&y<=4+((x*7)%5)) return '#2e8a58';
    return null; }),
  spike:makeTile((x,y)=>{ if(y<5) return null; if(y>=13) return hash(x,y)<0.6?'#3e1f38':'#5a2a4e';
    const lx=x%4; if(Math.abs(lx-1.5)<=(y-5)/3.4) return y<8?'#ffd0e8':(lx<2?'#c0608f':'#86396a'); return null; }),
  gate:makeTile((x,y)=>{ if(y===6||y===7) return '#4a3524'; const m=x%5; if(m===1) return '#8a6a46'; if(m===2) return '#5a4030';
    if(m===3&&(y+x)%6===0) return '#2e8a58'; return null; }),
  door:makeTile((x,y)=>{ if(x===0||x===15) return '#0e1418'; const n=hash(x,y+77); return n<0.1?'#2c3a44':n>0.9?'#1a242c':'#222e38'; }),
  crack:makeTile((x,y)=>{ const c=Math.abs(x-8-Math.round(Math.sin(y*0.9)*3))<1&&y>2&&y<14;
    const c2=Math.abs(y-8-Math.round(Math.sin(x)*2))<1&&x>3&&x<12&&hash(x,y)<0.7; return (c||c2)?'#05090a':null; }),
};

// ---------------------------------------------------------------- input
const keys={}, pressed={};
const BIND=[
  {left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],jump:['KeyW','Space'],attack:['KeyF','KeyC'],dash:['KeyG','KeyV'],special:['KeyE','KeyB']},
  {left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],jump:['ArrowUp','Numpad0'],attack:['Period','Numpad1'],dash:['Slash','Numpad2'],special:['ShiftRight','Numpad3','Quote']}];
const BLOCK=new Set(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period','Quote','Numpad0','Numpad1','Numpad2','Numpad3']);
addEventListener('keydown',e=>{ if(!keys[e.code]) pressed[e.code]=true; keys[e.code]=true; if(BLOCK.has(e.code)) e.preventDefault(); initAudio();
  if(state==='lobby'&&net.sub==='join'){
    if(e.key==='Backspace'){ net.typed=net.typed.slice(0,-1); e.preventDefault(); }
    else if(/^[a-z0-9]$/i.test(e.key)&&net.typed.length<4) net.typed+=e.key.toUpperCase(); } });
// Tab is the map key; keep it from moving browser focus
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
cvs.addEventListener('pointerdown',e=>{ cvs.focus(); initAudio(); if(state!=='title') return;
  const r=cvs.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*VW, y=(e.clientY-r.top)/r.height*VH;
  const m=MENU_RECTS.find(m=>x>=m.x&&x<=m.x+m.w&&y>=m.y&&y<=m.y+m.h); if(m){ menuSel=m.i; chooseMenu(m.i); } });
const padPrev=[{},{}];
function padState(i){
  const all=navigator.getGamepads?[...navigator.getGamepads()].filter(p=>p&&p.connected):[];
  const gp=all[i]; if(!gp) return null;
  const b=k=>!!(gp.buttons[k]&&gp.buttons[k].pressed), ax=gp.axes[0]||0, ay=gp.axes[1]||0;
  return {left:ax<-0.4||b(14),right:ax>0.4||b(15),up:ay<-0.5||b(12),down:ay>0.5||b(13),
    jump:b(0),attack:b(2),dash:b(1)||b(5)||b(7),special:b(3)||b(4)||b(6),start:b(9),back:b(8)};
}
function readInput(i){
  const B=BIND[i], any=a=>a.some(c=>keys[c]), anyP=a=>a.some(c=>pressed[c]);
  const s={left:any(B.left),right:any(B.right),up:any(B.up),down:any(B.down),jump:any(B.jump),attack:any(B.attack),dash:any(B.dash),special:any(B.special)};
  const e={jump:anyP(B.jump),attack:anyP(B.attack),dash:anyP(B.dash),special:anyP(B.special),start:false};
  const gp=padState(i), pv=padPrev[i];
  if(gp){ for(const k in s) s[k]=s[k]||gp[k];
    for(const k of ['jump','attack','dash','special','start']) e[k]=e[k]||(gp[k]&&!pv[k]);
    if(gp.back) padMapT=gtime;
    padPrev[i]=gp; } else padPrev[i]={};
  return {...s,jumpP:e.jump,attackP:e.attack,dashP:e.dash,specialP:e.special,startP:e.start,padA:!!(gp&&gp.jump&&!pv.jump)};
}

// ---------------------------------------------------------------- level
const LW=144, LH=100;
const AR={x0:100*TS, x1:130*TS, floor:86*TS, top:72*TS};   // Elder Grove: one screen, painted backdrop
const LEDGE_Y=83*TS;                                        // top of the left/right ledges in the grove
const GATE={x:99,y0:80,y1:82}, SEAL={x:84,y0:64,y1:68};
const PH=22;                                                // ghost hitbox height
// Camera zones (tiles). The camera frames the smallest zone holding the players' midpoint.
const ZONES=[
  {n:'MOONLIT EDGE',x0:0,y0:6,x1:70,y1:27},
  {n:'',x0:38,y0:25,x1:62,y1:56},                 // Rootwell shaft
  {n:'GLOWCAP HOLLOW',x0:16,y0:50,x1:85,y1:71},
  {n:'FERN THICKET',x0:0,y0:44,x1:20,y1:71},
  {n:'THORNWOOD',x0:83,y0:46,x1:124,y1:63},
  {n:'',x0:110,y0:43,x1:128,y1:52},               // Thornwood climb
  {n:'THORNWOOD CANOPY',x0:84,y0:28,x1:144,y1:46},
  {n:'ROOTDEEP',x0:8,y0:70,x1:64,y1:86},
  {n:'',x0:50,y0:84,x1:66,y1:90},                 // drop to the deep
  {n:'THE TANGLED DEEP',x0:18,y0:87,x1:85,y1:100},
  {n:'',x0:80,y0:60,x1:100,y1:89},                // seal corridor and descent
  {n:'ELDER GROVE',x0:100,y0:72,x1:130,y1:89}];
let grid=[], cover=new Uint8Array(LW*LH);
function tile(x,y){ if(x<0||x>=LW||y>=LH) return 1; if(y<0) return 0; return grid[y][x]; }
const solidT=t=>t===1||(t>=4&&t<=6);   // 4 boss gate, 5 cracked wall, 6 sigil seal
function setT(x,y,v){ if(x>=0&&x<LW&&y>=0&&y<LH) grid[y][x]=v; }
function groundY(c,r,h){ for(let y=Math.max(0,r);y<LH;y++){ const t=grid[y][c]; if(solidT(t)||t===2) return y*TS-h; } return LH*TS-h; }
function zoneAt(px,py){ let best=null,ba=1e12;
  for(const z of ZONES) if(px>=z.x0*TS&&px<z.x1*TS&&py>=z.y0*TS&&py<z.y1*TS){ const a=(z.x1-z.x0)*(z.y1-z.y0); if(a<ba){ ba=a; best=z; } }
  return best; }

function moveX(o,dx){
  if(!dx) return false; o.x+=dx;
  const t0=Math.floor(o.y/TS), t1=Math.floor((o.y+o.h-0.01)/TS);
  if(dx>0){ const tx=Math.floor((o.x+o.w-0.01)/TS); for(let ty=t0;ty<=t1;ty++) if(solidT(tile(tx,ty))){ o.x=tx*TS-o.w; return true; } }
  else { const tx=Math.floor(o.x/TS); for(let ty=t0;ty<=t1;ty++) if(solidT(tile(tx,ty))){ o.x=(tx+1)*TS; return true; } }
  return false;
}
function moveY(o,dy,drop){
  if(!dy) return null; const pb=o.y+o.h; o.y+=dy;
  const l=Math.floor(o.x/TS), r=Math.floor((o.x+o.w-0.01)/TS);
  if(dy>0){ const ty=Math.floor((o.y+o.h-0.01)/TS);
    for(let tx=l;tx<=r;tx++){ const t=tile(tx,ty); if(solidT(t)||(t===2&&!drop&&pb<=ty*TS+0.01)){ o.y=ty*TS-o.h; return 'floor'; } } }
  else { const ty=Math.floor(o.y/TS); for(let tx=l;tx<=r;tx++) if(solidT(tile(tx,ty))){ o.y=(ty+1)*TS; return 'ceil'; } }
  return null;
}
function floorTiles(o){
  const b=o.y+o.h, ty=Math.floor((b+0.5)/TS); if(Math.abs(b-ty*TS)>0.6) return [];
  const out=[]; for(let tx=Math.floor(o.x/TS);tx<=Math.floor((o.x+o.w-0.01)/TS);tx++) out.push(tile(tx,ty)); return out;
}
function probeFloor(o,drop){ return floorTiles(o).some(t=>solidT(t)||(t===2&&!drop)); }

    bond=0, linked=false, cam={x:0,y:0,zone:null,anchor:0}, respawn={x:64,y:387}, gameOverT=0, victoryT=0, hitstop=0, shakeMag=0,

    areaTitle={s:'',t:0}, banner={s:'',t:0}, visitedZones=new Set(), mapDirty=true, padMapT=-1;
const motes=Array.from({length:40},()=>({x:rnd(0,VW),y:rnd(0,VH),s:rnd(0.2,0.6),p:rnd(0.5,0.9),ph:rnd(0,7),c:Math.random()<0.6?'#e8ff9a':'#7ff5e0'}));
const stars=Array.from({length:90},()=>({x:rnd(0,960),y:rnd(0,170),b:Math.random()}));

function shake(m){ shakeMag=Math.max(shakeMag,m); }
function fxBurst(x,y,col,n,sp=80,grav=0,size=1){ for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), v=rnd(sp*0.3,sp);
  particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.3,0.7),max:0.7,col,s:Math.random()<0.3?size+1:size,grav}); } }
function fxDust(x,y,n){ for(let i=0;i<n;i++) particles.push({x:x+rnd(-4,4),y,vx:rnd(-30,30),vy:rnd(-30,-5),life:rnd(0.2,0.4),max:0.4,col:'#6d6890',s:1,grav:0}); }
function burst(...a){ rec('b',a); fxBurst(...a); }
function dust(...a){ rec('d',a); fxDust(...a); }
function popup(x,y,s,c){ rec('p',[x,y,s,c]); popups.push({x,y,s,c,life:1}); }
function sfx(n){ rec('s',[n]); playSfx(n); }
function nearest(x,y){ let best=null,bd=1e9; for(const p of players){ if(p.dead) continue; const d=Math.hypot(p.cx-x,p.cy-y); if(d<bd){bd=d;best=p;} } return best; }
function alivePlayers(){ return players.filter(p=>!p.dead); }

// ---------------------------------------------------------------- online co-op
// The host's browser runs the whole game. The guest sends its inputs ~60x/sec and
// draws the snapshots the host sends ~30x/sec, smoothing between them.
const HELD=['left','right','up','down','jump','attack','dash','special'], PRESS=['jump','attack','dash','special'];
const NEUTRAL_IN={left:false,right:false,up:false,down:false,jump:false,attack:false,dash:false,special:false,
  jumpP:false,attackP:false,dashP:false,specialP:false,startP:false,padA:false};
const net={mode:'local',role:'',ws:null,sub:'',code:'',typed:'',err:'',lost:false,lostMsg:'',frame:0,events:[],
  rin:null,used:[0,0,0,0],cnt:[0,0,0,0],seq:0,camT:0,camTY:0,navL:false,navR:false};
let menuSel=0, MENU_RECTS=[];
const r1=v=>Math.round(v*10)/10;
function myIndex(){ return net.mode==='guest'?1:0; }
function serverURL(){
  try{ const q=new URLSearchParams(location.search).get('server'); if(q) return q; }catch(e){}
  if(location.protocol==='http:'||location.protocol==='https:') return (location.protocol==='https:'?'wss://':'ws://')+location.host;
  return 'ws://localhost:8080';
}
function rec(type,args){
  if(net.mode!=='host'||net.events.length>300) return;
  net.events.push([type,...args.map(v=>typeof v==='number'?r1(v):v)]);
}
function playEvent([t,...a]){
  if(t==='s') playSfx(a[0]);
  else if(t==='b') fxBurst(...a);
  else if(t==='d') fxDust(...a);
  else if(t==='p') popups.push({x:a[0],y:a[1],s:a[2],c:a[3],life:1});
  else if(t==='n') banner={s:a[0],t:4};
}
function send(o){ if(net.ws&&net.ws.readyState===1) net.ws.send(JSON.stringify(o)); }
function mergeInputs(a,b){ const o={}; for(const k in a) o[k]=a[k]||b[k]; return o; }

function netConnect(onOpen){
  netClose();
  let ws;
  try{ ws=new WebSocket(serverURL()); }catch(e){ netFail(); return; }
  net.ws=ws;
  ws.onopen=onOpen;
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(err){ return; } netMessage(m); };
  ws.onclose=()=>{
    if(net.ws!==ws) return; net.ws=null;
    if(state==='lobby') netFail();
    else if(net.mode!=='local'){ net.lost=true; net.lostMsg='CONNECTION LOST'; }
  };
}
function netFail(){ net.err='CANNOT REACH SERVER AT '+serverURL().toUpperCase(); net.sub=net.role==='guest'?'join':'error'; }
function netClose(){ if(net.ws){ const ws=net.ws; net.ws=null; ws.onclose=null; try{ ws.close(); }catch(e){} } }
function netMessage(m){
  switch(m.t){
    case 'room': net.code=m.code; net.sub='hosting'; break;
    case 'error': net.err=String(m.msg).toUpperCase(); net.sub='join'; netClose(); break;
    case 'start':
      net.mode=net.role; net.rin=null; net.used=[0,0,0,0]; net.cnt=[0,0,0,0]; net.seq=0; net.events=[]; net.lost=false;
      startGame(); break;
    case 'left': net.lost=true; net.lostMsg='YOUR PARTNER DISCONNECTED'; netClose(); break;
    case 'in': if(net.mode==='host'&&(!net.rin||m.s>net.rin.s)) net.rin=m; break;
    case 'pause': if(net.mode==='host'&&state==='play') paused=!paused; break;
    case 'restart': if(net.mode==='host'&&state==='victory') startGame(); break;
    case 's': if(net.mode==='guest') applySnapshot(m); break;
  }
}
function backToTitle(){
  netClose(); net.mode='local'; net.role=''; net.lost=false; net.sub=''; net.err=''; paused=false; state='title';
}
function chooseMenu(i){
  if(i===0){ net.mode='local'; startGame(); return; }
  state='lobby'; net.err=''; net.code=''; net.typed='';
  if(i===1){ net.role='host'; net.sub='connecting'; netConnect(()=>send({t:'host'})); }
  else { net.role='guest'; net.sub='join'; }
}
function titleStep(){
  const m=mergeInputs(readInput(0),readInput(1));
  if(m.left&&!net.navL) menuSel=(menuSel+2)%3;
  if(m.right&&!net.navR) menuSel=(menuSel+1)%3;
  net.navL=m.left; net.navR=m.right;
  if(pressed.Enter||pressed.NumpadEnter||pressed.Space||m.padA||m.startP) chooseMenu(menuSel);
  updateParticles();
}
function lobbyStep(){
  readInput(0); readInput(1);
  if(pressed.Escape){ backToTitle(); return; }
  const enter=pressed.Enter||pressed.NumpadEnter;
  if(net.sub==='join'&&enter&&net.typed.length===4){
    const code=net.typed; net.err=''; net.sub='connecting'; netConnect(()=>send({t:'join',code}));
  } else if(net.sub==='error'&&enter) chooseMenu(1);
  updateParticles();
}

// ----- host side
function remoteInput(){
  const m=net.rin, o={...NEUTRAL_IN};
  if(!m) return o;
  HELD.forEach((k,b)=>{ o[k]=!!((m.h>>b)&1); });
  PRESS.forEach((k,j)=>{
    const c=m.c[j]|0;
    if(c<net.used[j]) net.used[j]=c;               // guest counters reset
    if(c-net.used[j]>3) net.used[j]=c-1;           // don't replay a backlog of old presses
    if(c>net.used[j]){ o[k+'P']=true; net.used[j]++; }  // one press per step
  });
  return o;
}
function syncRemoteCounts(){ if(net.rin) net.used=net.rin.c.map(v=>v|0); }
function snapshot(){
  const s={t:'s',st:state,pa:paused?1:0,go:r1(gameOverT),vt:r1(victoryT),cx:r1(cam.x),cy:r1(cam.y),bo:r1(bond),ln:linked?1:0,
    ba:bossActive?1:0,bd:bossDefeated?1:0,bt:r1(bossTitleT),fl:r1(flashT),sh:r1(shakeMag),k:kills,pt:Math.floor(playTime),
    gt:grid[GATE.y0][GATE.x]===4?1:0, sg:sigils, it:items.map(i=>i.taken?1:0), br:walls.map(w=>w.broken?1:0),
    p:players.map(p=>[r1(p.x),r1(p.y),r1(p.vx),r1(p.vy),p.face,p.hp,p.dead?1:0,r1(p.inv),r1(p.hurtT),r1(p.dashT),
      r1(p.atkT),p.atkDown?1:0,p.ground?1:0,r1(p.revive),p.gliding?1:0,p.maxHp,r1(p.deathT),r1(p.deathX),r1(p.deathY)]),
    e:enemies.filter(e=>!e.dead).map(e=>[e.id,MOB_KINDS.indexOf(e.type),r1(e.x),r1(e.y),e.face,e.state,r1(e.st),r1(e.hurtT)]),
    b:[r1(boss.x),r1(boss.y),boss.hp,boss.state,boss.phase,boss.face,r1(boss.st),r1(boss.age),r1(boss.hurtT)],
    pr:projectiles.map(p=>[p.anim,r1(p.x),r1(p.y),r1(p.vx),r1(p.vy),r1(p.t)]),
    hz:hazards.map(h=>[h.anim,r1(h.x),r1(h.y),h.flip?1:0,r1(h.t)]),
    nv:nova?[r1(nova.x),r1(nova.y),r1(nova.t)]:0,
    pk:pickups.map(h=>[r1(h.x),r1(h.y)]),
    la:lanterns.map(l=>l.active?1:0),
    ev:net.events};
  net.events=[];
  return s;
}

// ----- guest side
function guestStep(){
  const li=mergeInputs(readInput(0),readInput(1));
  PRESS.forEach((k,j)=>{ if(li[k+'P']) net.cnt[j]++; });
  let h=0; HELD.forEach((k,b)=>{ if(li[k]) h|=1<<b; });
  send({t:'in',s:++net.seq,h,c:net.cnt});
  if(state==='play'&&(pressed.KeyP||pressed.Escape||li.startP)) send({t:'pause'});
  if(state==='victory'&&(pressed.Enter||pressed.NumpadEnter||li.startP)) send({t:'restart'});
  if(paused&&pressed.KeyQ){ backToTitle(); return; }
  guestVisuals();
}
function applySnapshot(s){
  state=s.st; paused=!!s.pa; gameOverT=s.go; victoryT=s.vt; net.camT=s.cx; net.camTY=s.cy; bond=s.bo; linked=!!s.ln;
  bossActive=!!s.ba; bossDefeated=!!s.bd; bossTitleT=s.bt; flashT=Math.max(flashT,s.fl); shakeMag=Math.max(shakeMag,s.sh);
  kills=s.k; playTime=s.pt;
  for(let y=GATE.y0;y<=GATE.y1;y++) setT(GATE.x,y,s.gt?4:0);
  if(s.sg>=2&&grid[SEAL.y0][SEAL.x]===6){ for(let y=SEAL.y0;y<=SEAL.y1;y++) setT(SEAL.x,y,0); mapDirty=true; }
  sigils=s.sg;
  s.it.forEach((v,i)=>{ if(items[i]) items[i].taken=!!v; });
  s.br.forEach((v,i)=>{ const w=walls[i]; if(w&&v&&!w.broken){ w.broken=true; for(const [tx,ty] of w.tiles) setT(tx,ty,0); revealSecret(w.id); } });
  s.p.forEach((a,i)=>{
    const p=players[i], [x,y,vx,vy,face,hp,dead,inv,hurtT,dashT,atkT,atkDown,ground,revive,gl,mh,dT,dX,dY]=a;
    if(p.tx===undefined||Math.hypot(x-p.x,y-p.y)>48){ p.x=x; p.y=y; }
    Object.assign(p,{tx:x,ty:y,vx,vy,face,hp,dead:!!dead,inv,hurtT,dashT,atkT,atkDown:!!atkDown,ground:!!ground,revive,gliding:!!gl,maxHp:mh,deathT:dT,deathX:dX,deathY:dY});
  });
  const byId=new Map(enemies.map(e=>[e.id,e])), next=[];
  for(const [id,k,x,y,face,st,stT,hu] of s.e){
    let e=byId.get(id);
    if(!e){ e=new Mob(MOB_KINDS[k],x,y); e.id=id; }
    if(Math.hypot(x-e.x,y-e.y)>48){ e.x=x; e.y=y; }
    Object.assign(e,{tx:x,ty:y,face,state:st,st:stT,hurtT:hu});
    next.push(e);
  }
  enemies=next;
  const [bx,by,hp,bs,ph,bf,bst,bage,bhu]=s.b;
  if(boss.tx===undefined||boss.state==='wait'||Math.hypot(bx-boss.x,by-boss.y)>80){ boss.x=bx; boss.y=by; }
  Object.assign(boss,{tx:bx,ty:by,hp,state:bs,phase:ph,face:bf,st:bst,age:bage,hurtT:bhu});
  projectiles=s.pr.map(([anim,x,y,vx,vy,t])=>({anim,x,y,vx,vy,t}));
  hazards=s.hz.map(([anim,x,y,f,t])=>({anim,x,y,flip:!!f,t}));
  if(s.nv){ if(!nova) nova={hit:new Set()}; nova.x=s.nv[0]; nova.y=s.nv[1]; nova.t=s.nv[2]; } else nova=null;
  if(pickups.length!==s.pk.length) pickups=s.pk.map(([x,y])=>new Heart(x,y,false));
  else s.pk.forEach(([x,y],i)=>{ pickups[i].x=x; pickups[i].y=y; });
  s.la.forEach((a,i)=>{ if(lanterns[i]) lanterns[i].active=!!a; });
  for(const ev of s.ev) playEvent(ev);
}
function guestVisuals(){
  const k=0.35, lerp=o=>{ if(o.tx===undefined) return; o.x+=(o.tx-o.x)*k; o.y+=(o.ty-o.y)*k; };
  for(const p of players){ lerp(p); p.anim+=DT; p.atkT=Math.max(0,p.atkT-DT); p.dashT-=DT; p.inv-=DT; p.hurtT-=DT; if(p.dead) p.deathT+=DT; }
  for(const e of enemies){ lerp(e); e.t+=DT; e.st+=DT; e.hurtT-=DT; }
  if(boss){ lerp(boss); boss.t+=DT; boss.st-=DT; boss.age+=DT; boss.hurtT-=DT; }
  for(const p of projectiles){ p.x+=p.vx*DT; p.y+=p.vy*DT; p.t+=DT; }
  for(const h of hazards) h.t+=DT;
  if(nova){ nova.t+=DT; if(nova.t>=NOVA_T) nova=null; }
  for(const h of pickups) h.t+=DT;
  for(const l of lanterns) l.t+=DT;
  cam.x+=(net.camT-cam.x)*0.35;
  cam.y+=(net.camTY-cam.y)*0.35;
  afterCam();
  if(flashT>0) flashT-=DT;
  shakeMag*=0.88; if(shakeMag<0.2) shakeMag=0;
  if(!paused) ambientFx();
  updateParticles();
}

// ----- cosmetic effects derived from state (runs on host, local and guest alike)
function ambientFx(){
  for(const p of players){
    for(const t of p.trail) t.life-=DT; p.trail=p.trail.filter(t=>t.life>0);
    if(p.dead){ if(p.revive>0&&Math.random()<0.4) fxBurst(p.cx,p.cy,PAL[p.i].sword,1,40); continue; }
    if(p.dashT>0&&Math.floor(gtime*60)%3===0) p.trail.push({x:p.x,y:p.y,face:p.face,life:0.22});
    if(p.gliding&&Math.random()<0.3) particles.push({x:p.cx+rnd(-5,5),y:p.y+p.h,vx:0,vy:20,life:0.3,max:0.3,col:PAL[p.i].sword,s:1,grav:0});
  }
  if(bossActive&&boss){
    const b=boss;
    if(b.state==='intro'&&Math.random()<0.5) fxBurst(b.cx+rnd(-14,14),b.y+b.h,'#9fe8c8',1,30);
    else if(b.state==='cast'&&Math.random()<0.4) fxBurst(b.cx+rnd(-20,20),b.cy,'#7dffb0',1,50);
    else if(b.state==='dying'&&Math.random()<0.4) fxBurst(b.x+rnd(0,b.w),b.y+rnd(0,b.h),Math.random()<0.5?'#9fe8c8':'#5f8f50',8,90);
  }
}

// ---------------------------------------------------------------- player
class Player{
  constructor(i,x,y){ Object.assign(this,{i,x,y,w:12,h:PH,vx:0,vy:0,face:1,hp:5,maxHp:5,dead:false,ground:false,coyote:0,jbuf:0,
    jumping:false,dashT:0,dashCD:0,dashDir:1,canDash:true,atkT:0,atkCD:0,atkId:0,atkDown:false,pogoed:false,inv:0,hurtT:0,
    revive:0,dropT:0,offT:0,lastSafe:{x,y},trail:[],gliding:false,deathT:0,deathX:x,deathY:y,anim:Math.random()*5}); }
  get cx(){ return this.x+this.w/2; } get cy(){ return this.y+this.h/2; }
  partner(){ return players[1-this.i]; }
  hurt(d,srcX,force){
    if(this.dead) return; if(!force&&(this.inv>0||this.dashT>0)) return;
    this.hp-=d; this.inv=1.1; this.hurtT=0.22;
    const dir=srcX===undefined?-this.face:(this.cx<srcX?-1:1);
    this.vx=dir*160; this.vy=-200; this.dashT=0; this.atkT=0; this.jumping=false;
    shake(4); sfx('hurt'); burst(this.cx,this.cy,this.i?PAL[1].out:PAL[0].body,10);
    if(this.hp<=0) this.die();
  }
  die(){ this.dead=true; this.hp=0; this.revive=0; this.vx=this.vy=0; this.trail=[]; sfx('die'); this.deathT=0; this.deathX=this.cx; this.deathY=this.y+this.h;
    burst(this.cx,this.cy,PAL[this.i].body,26,110); burst(this.cx,this.cy,PAL[this.i].out,14,90);
    this.y=clamp(this.y,cam.y+24,cam.y+VH-30); popup(this.cx,this.y-8,PAL[this.i].name+' FADED','#ff9db0'); }
  reviveNow(hp=3){ const p=this.partner(); this.dead=false; this.hp=hp; this.inv=2; if(!p.dead){ this.x=p.x; this.y=p.y; }
    this.vx=this.vy=0; this.revive=0; sfx('revive'); burst(this.cx,this.cy,PAL[this.i].sword,24,90); popup(this.cx,this.y-8,'REVIVED!','#bff4ff'); }
  onSpikes(){ const l=Math.floor(this.x/TS), r=Math.floor((this.x+this.w-0.01)/TS), t=Math.floor(this.y/TS), b=Math.floor((this.y+this.h-0.01)/TS);
    for(let ty=t;ty<=b;ty++) for(let tx=l;tx<=r;tx++) if(tile(tx,ty)===3&&overlap(this,{x:tx*TS+2,y:ty*TS+9,w:12,h:7})) return true; return false; }
  swordBox(){ if(this.atkDown) return {x:this.x-6,y:this.y+this.h-3,w:this.w+12,h:22};
    return this.face>0?{x:this.x+this.w-3,y:this.y-2,w:26,h:24}:{x:this.x-23,y:this.y-2,w:26,h:24}; }
  update(inp){
    this.anim+=DT;
    if(this.dead){
      this.deathT+=DT;
      const dx=(inp.right?1:0)-(inp.left?1:0), dy=(inp.down?1:0)-(inp.up?1:0);
      this.vx=approach(this.vx,dx*95,700*DT); this.vy=approach(this.vy,dy*95,700*DT);
      this.x=clamp(this.x+this.vx*DT,cam.x+4,cam.x+VW-this.w-4); this.y=clamp(this.y+this.vy*DT,cam.y+24,cam.y+VH-this.h-8);
      const p=this.partner();
      if(!p.dead&&Math.hypot(p.cx-this.cx,p.cy-this.cy)<20){ this.revive+=DT;
        if(this.revive>=1.5) this.reviveNow(); }
      else this.revive=Math.max(0,this.revive-DT*0.5);
      return;
    }
    if(this.inv>0) this.inv-=DT; if(this.hurtT>0) this.hurtT-=DT;
    this.dashCD-=DT; this.atkCD-=DT; this.dropT-=DT;
    const dir=(inp.right?1:0)-(inp.left?1:0);
    if(inp.attackP&&this.atkCD<=0&&this.hurtT<=0){
      this.atkT=ATK_T; this.atkCD=0.3; this.atkId=++swingId; this.atkDown=inp.down&&!this.ground; this.pogoed=false;
      if(dir) this.face=dir; sfx('slash'); }
    if(inp.dashP&&this.dashCD<=0&&this.canDash&&this.hurtT<=0){
      this.dashT=0.15; this.dashCD=0.42; this.dashDir=dir||this.face; this.face=this.dashDir; this.jumping=false;
      if(!this.ground) this.canDash=false; sfx('dash'); burst(this.cx,this.cy,PAL[this.i].sword,6,50); }
    if(this.dashT>0){
      this.dashT-=DT; this.vx=this.dashDir*280; this.vy=0; this.gliding=false;
    } else {
      if(dir&&this.atkT<=0) this.face=dir;
      const acc=this.hurtT>0?200:(this.ground?1100:750);
      this.vx=approach(this.vx,dir*MOVE,acc*DT);
      this.vy+=GRAV*DT;
      const glide=inp.jump&&this.vy>0&&!inp.down;
      const maxFall=glide?48:380;
      if(this.vy>maxFall) this.vy=glide?Math.max(maxFall,this.vy-1400*DT):maxFall;
      this.gliding=glide;
      if(this.jumping&&!inp.jump&&this.vy<-110) this.vy=-110;
      if(this.vy>=0) this.jumping=false;
    }
    if(inp.jumpP) this.jbuf=0.12; else this.jbuf-=DT;
    if(this.ground) this.coyote=0.1; else this.coyote-=DT;
    if(this.jbuf>0&&this.coyote>0&&this.hurtT<=0){
      const ft=floorTiles(this);
      if(inp.down&&ft.length&&ft.includes(2)&&!ft.some(solidT)){ this.dropT=0.25; this.jbuf=0; this.coyote=0; this.ground=false; }
      else { this.vy=-JUMP; this.jumping=true; this.jbuf=0; this.coyote=0; this.dashT=0; sfx('jump'); dust(this.cx,this.y+this.h,4); }
    }
    // horizontal + screen edges (edges block, never push)
    const px=this.x; moveX(this,this.vx*DT);
    const minX=cam.x+2, maxX=cam.x+VW-this.w-2;
    if(this.x<minX&&this.x<px){ this.x=Math.min(px,minX); this.vx=0; }
    if(this.x>maxX&&this.x>px){ this.x=Math.max(px,maxX); this.vx=0; }
    const res=moveY(this,this.vy*DT,this.dropT>0);
    if(res==='ceil'){ this.vy=0; this.jumping=false; }
    const wasG=this.ground, fallV=this.vy;
    this.ground=res==='floor'||(this.vy>=0&&probeFloor(this,this.dropT>0));
    if(this.ground){ if(this.vy>0) this.vy=0; if(this.dashT<=0) this.canDash=true;
      if(!wasG&&fallV>200){ dust(this.cx,this.y+this.h,5); sfx('land'); } }
    if(this.ground&&!this.onSpikes()){ const ft=floorTiles(this); if(ft.length&&ft.every(t=>t===1||t===2)) this.lastSafe={x:this.x,y:this.y}; }
    // sword
    if(this.atkT>0){ this.atkT-=DT; if(this.atkT>ATK_T-0.13) this.swordHits(); }
    // hazards
    if(this.onSpikes()&&this.inv<=0&&this.dashT<=0){ this.hurt(1); this.vy=-270; }
    if(this.y>LH*TS+16){
      this.hurt(1,undefined,true);
      if(!this.dead){ const p=this.partner(), s=!p.dead?p.lastSafe:this.lastSafe; this.x=s.x; this.y=s.y-2; this.vx=this.vy=0; this.inv=1.5;
        burst(this.cx,this.cy,PAL[this.i].sword,12,60); }
    }
  }
  swordHits(){
    const box=this.swordBox(); let hit=false, struck=false;
    for(const e of enemies){ if(e.dead||e.dying||e.hitIds.has(this.atkId)||!overlap(box,e)) continue;
      e.hitIds.add(this.atkId); e.hurt(1,this.face); hit=struck=true; bond=Math.min(100,bond+4); }
    if(boss&&boss.vulnerable()&&!boss.hitIds.has(this.atkId)&&overlap(box,boss)){
      boss.hitIds.add(this.atkId); boss.hurt(1); hit=struck=true; bond=Math.min(100,bond+3);
      burst(clamp(box.x+box.w/2,boss.x,boss.x+boss.w),this.cy,'#9fe8c8',6,80); }
    for(const w of walls){ if(w.broken||w.hitIds.has(this.atkId)) continue;
      if(w.tiles.some(([tx,ty])=>overlap(box,{x:tx*TS,y:ty*TS,w:TS,h:TS}))){ w.hitIds.add(this.atkId); hitWall(w); hit=true; } }
    for(const p of projectiles){ if(!p.dead&&overlap(box,prjBox(p))){ p.dead=true; hit=true; sfx('parry'); prjImpact(p); } }
    if(this.atkDown){ const l=Math.floor(box.x/TS),r=Math.floor((box.x+box.w)/TS),t=Math.floor(box.y/TS),b=Math.floor((box.y+box.h)/TS);
      for(let ty=t;ty<=b;ty++) for(let tx=l;tx<=r;tx++) if(tile(tx,ty)===3) hit=true; }
    if(struck) hitstop=Math.max(hitstop,0.045);
    if(hit&&this.atkDown&&!this.pogoed){ this.vy=-285; this.jumping=false; this.canDash=true; this.pogoed=true; }
  }
  pose(){
    const k=PAL[this.i].key;
    if(this.hurtT>0) return [k+'.hurt',this.hurtT>0.14?0:1];
    if(this.dashT>0) return [k+'.dash',Math.min(2,Math.floor((0.15-this.dashT)/0.05))];
    if(this.atkT>0) return [k+'.attack',Math.min(4,Math.floor((ATK_T-this.atkT)/ATK_T*5))];
    if(!this.ground) return [k+(this.vy<0?'.jump':'.fall'),Math.floor(this.anim*8)%2];
    if(Math.abs(this.vx)>15) return [k+'.run',Math.floor(this.anim*12)%6];
    return [k+'.idle',Math.floor(this.anim*6)%4];
  }
  draw(){
    const k=PAL[this.i].key;
    for(const t of this.trail) drawAnim(k+'.dash',1,t.x+this.w/2,t.y+this.h,14,30,t.face<0,t.life*1.8);
    if(this.dead){ this.drawSpirit(); return; }
    const blink=this.inv>0&&this.dashT<=0&&this.hurtT<=0&&Math.floor(this.inv*15)%2===0;
    const [n,i]=this.pose();
    if(!blink) drawAnim(n,i,this.cx,this.y+this.h,14,30,this.face<0);
    if(this.atkT>0){
      const sn=k+'.slash', si=Math.min(4,Math.floor((ATK_T-this.atkT)/ATK_T*5));
      if(this.atkDown) drawAnimRot(sn,si,this.cx,this.y+this.h+8,Math.PI/2);
      else drawAnim(sn,si,this.cx+this.face*14,this.cy,16,16,this.face<0);
    }
  }
  drawSpirit(){
    const k=PAL[this.i].key;
    if(this.deathT<0.6){ drawAnim(k+'.death',Math.floor(this.deathT*10),this.deathX,this.deathY,14,30,this.face<0); return; }
    const y=this.y+this.h+Math.sin(this.anim*4)*2;
    drawAnim(k+'.death',0,this.cx,y,14,30,this.face<0,0.45+0.15*Math.sin(this.anim*6));
    if(this.revive>0){ const n=24, c=Math.floor(n*this.revive/1.5); g.fillStyle='#bff4ff';
      for(let i=0;i<c;i++){ const a=-Math.PI/2+i/n*Math.PI*2; g.fillRect(Math.round(this.cx+Math.cos(a)*16),Math.round(y-15+Math.sin(a)*16),1,1); } }
  }
}

// Six mobs from sprites/magic_mobs_v2_showcase.png. Each attack spawns its effect animation as a hazard.
const MOB_KINDS=['arcane_slime','crystal_golem','shroom_mage','hex_lantern','grimoire','star_moth'];
const MOB={   // ax,ay: frame anchor (feet for walkers, centre for flyers); face: which way the art faces
